<title>筑駒理科ジム</title>
<!-- built 2026-10-04 / 単一ファイル・通信なし -->
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --ink:#16293a; --sub:#5d7389; --line:#dde5ec;
  --accent:#0f6fa8; --accent2:#0a5580; --ok:#15803d; --okbg:#e8f6ed;
  --ng:#b91c1c; --ngbg:#fdeceb; --warn:#9a5b00; --warnbg:#fff6e5;
  --r:14px; --shadow:0 1px 2px rgba(16,40,64,.06),0 4px 16px rgba(16,40,64,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  font-size:17px; line-height:1.7; -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
header{
  position:sticky; top:0; z-index:20; background:#fff; border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px; display:flex; align-items:center; gap:12px;
}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em}
header .sp{flex:1}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:18px 0 8px;color:var(--sub)}
p{margin:.5em 0}
.muted{color:var(--sub);font-size:14px}
.tiny{color:var(--sub);font-size:13px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:#fff;padding:14px 16px;min-height:50px}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;width:100%}
.btn-primary:disabled{background:#9fb6c6;border-color:#9fb6c6}
.btn-ghost{background:#fff}
.grid{display:grid;gap:12px}
.grid.g2{grid-template-columns:repeat(2,1fr)}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.menu button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:16px}
.menu .t{font-weight:700}
.menu .d{font-size:13px;color:var(--sub);line-height:1.5}
.pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:#eef3f7;color:var(--sub);margin-right:6px}
.pill.w{background:var(--warnbg);color:var(--warn)}
.pill.o{background:var(--okbg);color:var(--ok)}
.pill.n{background:var(--ngbg);color:var(--ng)}
table{border-collapse:collapse;width:100%;font-size:15px;margin:10px 0}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left}
th{background:#f7fafc;font-weight:600}
.qbox{font-size:18px;line-height:1.8;margin:4px 0 14px}
.cond{background:#f7fafc;border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 8px 8px 0;font-size:15px;margin:10px 0}
/* 選択肢の○×△ */
.optrow{display:flex;align-items:stretch;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#fff}
.optrow .ot{flex:1;display:flex;align-items:center;font-size:16px;line-height:1.6}
.optrow .ob{display:flex;gap:6px;flex-shrink:0;align-items:center}
.jb{width:48px;min-height:46px;padding:0;font-size:19px;font-weight:700;border-radius:10px;background:#fff}
.jb.sel-o{background:var(--ok);border-color:var(--ok);color:#fff}
.jb.sel-x{background:var(--ng);border-color:var(--ng);color:#fff}
.jb.sel-q{background:#b08400;border-color:#b08400;color:#fff}
.optrow.res-ok{background:var(--okbg);border-color:#9ed4b2}
.optrow.res-ng{background:var(--ngbg);border-color:#e8a9a5}
.mark{font-size:13px;font-weight:700;padding:2px 8px;border-radius:999px;align-self:center;white-space:nowrap}
.mark.ok{background:var(--ok);color:#fff}
.mark.ng{background:var(--ng);color:#fff}
.numin{width:100%;font:inherit;font-size:22px;padding:14px;border:1px solid var(--line);border-radius:12px;text-align:center}
.svgbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;overflow-x:auto}
svg{display:block;max-width:100%;height:auto}
svg .w{stroke:#16293a;stroke-width:3;fill:none}
svg .thick{stroke:#16293a;stroke-width:6;fill:none}
svg .bulb circle{stroke:#16293a;stroke-width:3;fill:#fffbe8}
svg .bulb path{stroke:#16293a;stroke-width:2.5;fill:none}
svg .bulb text,svg .sw text,svg .batt text{font-size:17px;font-weight:700;fill:#16293a;text-anchor:middle;font-family:inherit}
svg .sw circle{fill:#16293a}
svg .sw path{stroke:#16293a;stroke-width:3.5;fill:none}
svg .batt path{stroke:#16293a}
.expl{background:#f7fafc;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:15px;white-space:pre-wrap;line-height:1.75}
.bar{height:10px;background:#e8eef4;border-radius:999px;overflow:hidden;margin:6px 0 2px}
.bar>i{display:block;height:100%;background:var(--accent)}
.timer{font-size:68px;font-weight:800;text-align:center;letter-spacing:.02em;font-variant-numeric:tabular-nums;margin:8px 0;transition:background-color .3s}
.timer.low{color:var(--ng)}
.timer.flash{background:#fff3b0;border-radius:12px;animation:tflash 1.2s ease}
@keyframes tflash{0%{background:#ffe066}100%{background:transparent}}
.should-note{text-align:center;color:var(--sub);font-size:15px;margin:0}
.should-note.changed{color:var(--ng);font-weight:700}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 20px);background:#16293a;color:#fff;padding:12px 18px;border-radius:999px;font-size:15px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.hint{border:1px dashed var(--line);border-radius:12px;font-size:14px;color:var(--sub);background:#fcfdfe}
.hint>summary{display:block;list-style:none;padding:12px 14px;min-height:44px;line-height:22px;cursor:pointer}
.hint>summary::-webkit-details-marker{display:none}
.hint>summary::before{content:'▸ ';color:var(--accent);font-weight:700}
.hint[open]>summary::before{content:'▾ '}
.hint>div{padding:0 14px 12px}
textarea{width:100%;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px}
@media (max-width:520px){ .grid.g3{grid-template-columns:1fr 1fr} .timer{font-size:56px} }
</style>
</head>

// 生成元 sha256: 177b7f524223ba2cac054464da32280442d641a3a66025a35e72ee3f8cd80e6f
const CARDS = [{"id":"T01a","theme":"種子の栄養はどこにある？","cat":"生物","q":"成熟したインゲンマメは有胚乳種子・無胚乳種子のどちら？ 発芽直後に使う栄養を主に蓄えている部分も答えよう。","cond":"成熟した種子について答える。","a":"無胚乳種子。栄養を主に蓄えるのは子葉。","exp":"「無胚乳」は栄養がないという意味ではない。成熟したインゲンマメでは主に子葉に栄養が蓄えられ、発芽後の成長に使われる。","miss":"分類名と栄養の有無を混同しない。","fig":"","table":{"headers":["対象","成熟したインゲンマメ"],"rows":[["調べる部分","子葉／胚乳／種皮"],["時期","発芽直後"]]}},{"id":"T01b","theme":"種子の栄養はどこにある？","cat":"生物","q":"成熟したカキの種子では、胚乳が子葉の外に残っている。胚乳の主な働きは？ インゲンマメでは主にどの部分が同じ働きをする？","cond":"成熟した種子について答える。","a":"胚乳は発芽・初期の成長に使う栄養を蓄える。インゲンマメでは主に子葉。","exp":"同じ栄養供給の働きでも、植物によって蓄える場所が異なる。種皮の主な働きは種子を保護すること。","miss":"子葉と胚乳を、どの植物でも同じ配置と考えない。","fig":"","table":{"headers":["対象","成熟したカキの種子"],"rows":[["残っている部分","子葉の外の胚乳"],["比較する種子","インゲンマメ"]]}},{"id":"T02a","theme":"根毛の働き","cat":"生物","q":"根毛があると水や、水に溶けた肥料を吸収しやすい。その理由を説明しよう。","cond":"図は根と根毛の模式図。","a":"根毛によって、土の中の水と接する根の表面積が大きくなるから。","exp":"長く細い突起が多数あることで、水や溶けた無機養分を取り込むための表面が広くなる。","miss":"「面積が増える」だけでなく、何と接する面積かを言う。","fig":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 340\" role=\"img\" aria-label=\"R：根、H：根毛。模式図。\"><defs><marker id=\"arrow\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4\" orient=\"auto\"><path d=\"M0 0 L8 4 L0 8\" fill=\"#007f83\"/></marker></defs><rect width=\"640\" height=\"340\" rx=\"8\" fill=\"white\"/><g font-family=\"sans-serif\" font-size=\"42\" fill=\"#16374b\"><rect x=\"270\" y=\"50\" width=\"55\" height=\"200\" rx=\"20\" fill=\"#eaf3f8\" stroke=\"#164565\" stroke-width=\"3\"/><path d=\"M270 75 H180 M325 75 H415\" stroke=\"#007f83\" stroke-width=\"3\"/><path d=\"M270 110 H180 M325 110 H415\" stroke=\"#007f83\" stroke-width=\"3\"/><path d=\"M270 145 H180 M325 145 H415\" stroke=\"#007f83\" stroke-width=\"3\"/><path d=\"M270 180 H180 M325 180 H415\" stroke=\"#007f83\" stroke-width=\"3\"/><path d=\"M270 215 H180 M325 215 H415\" stroke=\"#007f83\" stroke-width=\"3\"/><text x=\"280\" y=\"300\">R</text><text x=\"450\" y=\"170\">H</text></g></svg>","table":{"headers":["構造","根の表面に細い突起"],"rows":[["取り込むもの","水／溶けた無機養分"]]}},{"id":"T02b","theme":"根毛の働き","cat":"生物","q":"同じ長さの根X・Yで吸水量を比べた。Xの吸水量が多い理由を「根が長いから」と説明してよい？ 根毛の働きに基づいて説明しよう。","cond":"根は同じ種類で太さも同じ。根毛の多さ以外の条件をそろえ、同じ時間の吸水量を調べた。","a":"「根が長いから」とは説明できない。根の長さは同じ。Xには根毛が多く、水と接する表面積が大きいので吸水量が多いと考えられる。","exp":"長さの違いはこの比較の原因にできない。そろえた条件と、違わせた条件を区別する。根毛は、水を吸収するための接触面を広くする。","miss":"根全体の長さと、根毛によって増える表面積を区別する。","fig":"","table":{"headers":["根","長さ","根毛","吸水量"],"rows":[["X","10cm","多い","12mL"],["Y","10cm","少ない","6mL"]]}},{"id":"T03a","theme":"採取したたい積物","cat":"生物・地学","q":"同じ質量のたい積物にそろえたとき、貝が多い順は？","cond":"各地点の試料は、その地点を代表しているとする。","a":"B→C→A。","exp":"10gあたりにそろえるとAは4個、Bは8個、Cは6個。採取量が多いほど見つかる個数も増えるため、基準をそろえて比べる。","miss":"「合計個数が最多」と「同じ質量で最多」は違う。","fig":"","table":{"headers":["地点","採取量","貝の個数"],"rows":[["A","60g","24個"],["B","20g","16個"],["C","40g","24個"]]}},{"id":"T03b","theme":"採取したたい積物","cat":"生物・地学","q":"同じ質量あたりの化石Pが多いほど、生息場所に近いとする。近い順に4地点を並べよう。","cond":"化石Pの生息場所に近いほど、同じ質量あたりに含まれる個数が多い。流され方や保存状態の違いはないものとする。","a":"D→B→C→A。","exp":"10gあたりはA=2、B=6、C=4、D=8個。すべて同じ基準に直してから、多い順に並べる。","miss":"途中の2地点だけを比べて終えない。","fig":"","table":{"headers":["地点","採取量","化石P"],"rows":[["A","30g","6個"],["B","50g","30個"],["C","20g","8個"],["D","40g","32個"]]}},{"id":"T04a","theme":"水溶液の冷却","cat":"化学","q":"水100gに物質Pを20g溶かし、80℃から0℃まで冷やす。液体部分の質量百分率濃度は、どのように変わる？ 変化が始まる温度も答えよう。","cond":"表は水100gに溶ける最大量。蒸発しない。冷却に十分な時間をかけ、結晶が出たら液体部分だけを考える。 表にない温度での最大量は、表の点どうしを直線で結んだ値とする。","a":"40℃までは変わらず、40℃より低くなると下がる。","exp":"40℃まではP20gがすべて溶けたままで、濃度は20÷120×100%。40℃でちょうど飽和する。それより低温では溶けているPが減り、水の質量は100gのまま。","miss":"冷却しただけでは、結晶が出る前の濃度は変わらない。","fig":"","table":{"headers":["温度","水100gに溶ける最大量"],"rows":[["80℃","60g"],["40℃","20g"],["0℃","10g"]]}},{"id":"T04b","theme":"水溶液の冷却","cat":"化学","q":"80℃の水溶液300gを20℃に冷やすと、結晶が60g出た。冷却前の濃度は何%？","cond":"Pは水100gに対し80℃で最大80g、20℃で最大20g溶ける。蒸発せず、結晶は純粋なP。冷却後の液体は飽和している。","a":"約33.3%（正確には33と1/3%）。","exp":"冷却後の液体は240g。水：P=100：20なので水200g、溶けたP40g。最初のPは40+60=100g。100÷300×100%=33と1/3%。","miss":"300gを水の質量にしない。最初から飽和とは書かれていない。","fig":"","table":{"headers":["初めの水溶液","300g"],"rows":[["冷却で出た結晶","60g"],["20℃の溶解度","水100gにP20g"],["80℃の溶解度","水100gにP80g"]]}},{"id":"T05a","theme":"水中の空気の体積","cat":"物理","q":"海面で480cm³の空気を水深30mへ沈める。空気の体積は？","cond":"海面の全圧は1気圧。10m深くなるごとに全圧が1気圧増す。温度一定。空気は漏れず、水に溶けない。圧縮できる柔らかい袋を使う。","a":"120cm³。","exp":"水深30mの全圧は1+3=4気圧。1×480=4×体積なので120cm³。","miss":"水深30mを3気圧としない。大気圧の1気圧を足す。","fig":"","table":{"headers":["深さ","全圧"],"rows":[["0m","1気圧"],["10m","2気圧"],["20m","3気圧"],["30m","？"]]}},{"id":"T05b","theme":"水中の空気の体積","cat":"物理","q":"水深50mで200cm³だった空気を、水深20mへ上げる。体積は？","cond":"海面の全圧は1気圧。10m深くなるごとに全圧が1気圧増す。温度一定。空気の出入りや溶解はなく、袋は自由に変形する。","a":"400cm³。","exp":"全圧は50mで6気圧、20mで3気圧。6×200÷3=400。深さの比50：20ではなく、全圧の比6：3を使う。","miss":"出発点も到着点も、全圧へ直す。","fig":"","table":{"headers":["状態","水深","体積"],"rows":[["初め","50m","200cm³"],["移動後","20m","？"],["海面","0m","全圧1気圧"]]}},{"id":"T06a","theme":"反射した音が重なる時刻","cat":"物理","q":"音源と聞き手が壁から85mの同じ位置にいる。1回たたいた音の反射音は、直接音の何秒後に聞こえる？","cond":"音速340m/s。壁は1つ。音源と聞き手は同じ位置にあるとする。","a":"0.5秒後。","exp":"反射音は85×2=170mを進む。170÷340=0.5秒。反射音が遅れるのは、経路が長いから。","miss":"壁までの片道85mだけで計算しない。","fig":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 340\" role=\"img\" aria-label=\"S：音源と聞き手、W：壁。位置関係を示す模式図。縮尺はない。\"><defs><marker id=\"arrow\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4\" orient=\"auto\"><path d=\"M0 0 L8 4 L0 8\" fill=\"#007f83\"/></marker></defs><rect width=\"640\" height=\"340\" rx=\"8\" fill=\"white\"/><g font-family=\"sans-serif\" font-size=\"42\" fill=\"#16374b\"><circle cx=\"100\" cy=\"155\" r=\"18\" fill=\"#164565\"/><path d=\"M125 155 H530\" stroke=\"#a6b4c0\" stroke-width=\"2\"/><path d=\"M550 55 V255\" stroke=\"#164565\" stroke-width=\"8\"/><text x=\"80\" y=\"310\">S</text><text x=\"530\" y=\"310\">W</text></g></svg>","table":{"headers":["音源・聞き手","壁から85m"],"rows":[["音速","340m/s"],["直接音","経路0mとしてよい"]]}},{"id":"T06b","theme":"反射した音が重なる時刻","cat":"物理","q":"同じ位置で太鼓を等間隔に3回たたいた。直接音3つと反射音3つが重なり、4回に聞こえた。たたく間隔は？","cond":"反射音は直接音の0.6秒後に届く。重なった音だけを1回と数え、その他は別の音として聞き分ける。太鼓をたたく間隔は正。","a":"0.6秒。","exp":"間隔0.6秒なら、直接音は0、0.6、1.2秒、反射音は0.6、1.2、1.8秒。2組が重なり、異なる時刻は4つ。間隔0.3秒では異なる時刻は5つになる。","miss":"音の個数を足す前に、聞こえる時刻を並べる。","fig":"","table":{"headers":["直接音","3回・等間隔"],"rows":[["反射音","各直接音の0.6秒後"],["聞こえた回数","4回"],["問い","たたく間隔"]]}},{"id":"T07a","theme":"音を出した間隔と、聞こえる間隔","cat":"物理","q":"音源が時速72kmで聞き手へ近づき、6.8秒間隔で2回音を出した。聞こえる間隔は？","cond":"聞き手は静止。音速340m/s。音源は聞き手と音源を結ぶ直線上を一定の速さで移動し、2回目の音を出すまで聞き手を通り過ぎない。","a":"6.4秒。","exp":"72km/h=20m/s。6.8秒で136m近づくので、2回目の音の到着にかかる時間は136÷340=0.4秒短い。6.8−0.4=6.4秒。","miss":"動く音源の速さを、空気中の音速に足さない。","fig":"","table":{"headers":["音源の速さ","72km/h"],"rows":[["出す間隔","6.8秒"],["音速","340m/s"],["移動方向","聞き手に近づく"]]}},{"id":"T07b","theme":"音を出した間隔と、聞こえる間隔","cat":"物理","q":"音源が毎秒17mで聞き手から遠ざかりながら、20秒間ずっと音を出した。聞き手には何秒間聞こえる？","cond":"聞き手は静止。音速340m/s。音源は聞き手と音源を結ぶ直線上を一定の速さで移動する。","a":"21秒間。","exp":"20秒で340m遠ざかる。最後の音は最初の音より、到着まで1秒余計にかかる。20+1=21秒。","miss":"接近なら短く、遠ざかるなら長くなる。","fig":"","table":{"headers":["音源の速さ","17m/s"],"rows":[["音を出す時間","20秒"],["音速","340m/s"],["移動方向","聞き手から遠ざかる"]]}},{"id":"T08a","theme":"経度と太陽の南中","cat":"天体・時差","q":"東経60度の地点より、太陽の南中が6時間遅い地点の経度は？","cond":"経度による太陽の南中時刻の違いを考える。時差の制度や夏時間は考えない。","a":"西経30度。","exp":"地球は西から東へ自転するので、東の地点ほど太陽が先に南中する。経度15度の差が1時間の差に相当する。南中が遅い地点は西側。6×15=90度だけ西へ進む。東経60度から西へ90度なので、西経30度。","miss":"「遅い」を東へ進むと考えない。","fig":"","table":{"headers":["基準の地点","東経60度"],"rows":[["南中の差","6時間遅い"]]}},{"id":"T08b","theme":"経度と太陽の南中","cat":"天体・時差","q":"西経45度の地点Pで太陽が南中した。この瞬間、地点Qでは南中から5時間たっていた。Qの経度を答えよう。","cond":"経度による太陽の南中時刻の違いを考える。時差の制度や夏時間は考えない。","a":"東経30度。","exp":"QではPより5時間早く南中しているので、QはPの東側。地球は西から東へ自転し、経度15度の差が1時間の差に相当する。5×15=75度。西経45度から東へ75度進むと東経30度になる。","miss":"「南中から5時間たった」は、南中が5時間遅いという意味ではない。","fig":"","table":{"headers":["地点","経度","同じ瞬間の太陽"],"rows":[["P","西経45度","南中した"],["Q","？","南中から5時間後"]]}},{"id":"T09a","theme":"ばねの全長・伸び・元の長さ","cat":"物理","q":"同じ材質・太さ・巻き方のばねを、自然長30cmに切った。20gを下げたときの全長は？","cond":"材質・太さ・巻き方が同じばねを切る。自然長20cmのばねは10gで4cm伸びる。ばね自身の重さは無視し、比例関係が成り立つ範囲で考える。","a":"42cm。","exp":"20cmのばねの2倍の重さなら伸び8cm。自然長30cmは20cmの1.5倍なので伸び12cm。全長30+12=42cm。","miss":"伸び12cmを、全長の答えにしない。","fig":"","table":{"headers":["自然長","10gを下げたときの伸び"],"rows":[["10cm","2cm"],["20cm","4cm"],["30cm","？"],["今回の重さ","20g"]]}},{"id":"T09b","theme":"ばねの全長・伸び・元の長さ","cat":"物理","q":"同じ自然長のばね2本に、重さの違うおもりを下げた。重さの差は30g、全長の差は18cm。ばねの自然長は？","cond":"2本は材質・太さ・巻き方が同じ。ばね自身の重さは無視し、比例関係が成り立つ範囲で考える。","a":"30cm。","exp":"同じ自然長なので、全長の差は伸びの差。自然長20cmなら重さの差30gで伸びの差12cm。実際は18cmなので自然長は20×18÷12=30cm。","miss":"自然長を引けなくても、同じばね同士の差なら打ち消せる。","fig":"","table":{"headers":["基準の自然長","10gのときの伸び"],"rows":[["10cm","2cm"],["20cm","4cm"],["30cm","6cm"],["今回の重さの差","30g"],["今回の全長の差","18cm"]]}},{"id":"T10a","theme":"蒸発させると固体が残る？","cat":"化学","q":"図表の4種類の水溶液のうち、水を十分に蒸発させた後に固体の溶質が残るものをすべて選ぼう。","cond":"容器の汚れや不純物はない。水分を十分に蒸発させる。飛び散りや、加熱による分解はないものとする。","a":"食塩水、ホウ酸水。","exp":"食塩とホウ酸は固体の溶質なので残る。塩酸の塩化水素、アンモニア水のアンモニアは気体の溶質で、この条件では水とともに取り去られる。","miss":"固体が残らないことは、初めから溶質がないという意味ではない。","fig":"","table":{"headers":["水溶液","溶質"],"rows":[["食塩水","食塩"],["塩酸","塩化水素"],["アンモニア水","アンモニア"],["ホウ酸水","ホウ酸"]]}},{"id":"T10b","theme":"蒸発させると固体が残る？","cat":"化学","q":"透明な液体Xを蒸発皿に入れ、水分がなくなるまで加熱した。固体は残らなかった。Xは純粋な水だと断定できる？ 例を1つ挙げよう。","cond":"容器の汚れや不純物はない。水分は十分に蒸発させたものとする。飛び散りや、加熱による分解はない。","a":"断定できない。例：塩酸、アンモニア水、炭酸水のいずれか。","exp":"気体が溶けた水溶液でも、水と溶質の気体を取り去ると固体が残らない。透明という見た目も、水だけを示す証拠にはならない。","miss":"「固体が残らない→水だけ」という逆向きの断定をしない。","fig":"","table":{"headers":["Xの見た目","透明"],"rows":[["観察結果","固体が残らない"],["問い","純粋な水と言い切れる？"]]}},{"id":"T11a","theme":"中和した後、何が余っている？","cat":"化学","q":"塩酸20mLと水酸化ナトリウム水溶液30mLを混ぜた。BTB液と赤色リトマス紙の結果は？","cond":"この2種類の水溶液は同じ体積同士でちょうど中和する。指示薬の色変化を明瞭に観察できる濃さとする。","a":"BTB液は青。赤色リトマス紙は青に変わる。","exp":"中和に使う水酸化ナトリウム水溶液は20mL分。10mL分が余り、混合液はアルカリ性になる。「混ぜた」だけで中性とは限らない。","miss":"中和が起こることと、混合液が中性になることを区別する。","fig":"","table":{"headers":["ちょうど中和","塩酸10mL＋アルカリ10mL"],"rows":[["今回の塩酸","20mL"],["今回のアルカリ","30mL"]]}},{"id":"T11b","theme":"中和した後、何が余っている？","cat":"化学","q":"図表の量を混ぜた後、BTB液と青色リトマス紙はどうなる？","cond":"塩酸10mLと水酸化ナトリウム水溶液20mLでちょうど中和する。指示薬の色変化を明瞭に観察できる濃さとする。","a":"BTB液は黄。青色リトマス紙は赤に変わる。","exp":"アルカリ30mLを中和するのに必要な塩酸は15mL。塩酸20mLのうち5mL分が余るので酸性。体積が多い方をそのまま「余る方」にしない。","miss":"体積だけでなく、ちょうど中和する割合を使う。","fig":"","table":{"headers":["ちょうど中和","塩酸10mL＋アルカリ20mL"],"rows":[["今回の塩酸","20mL"],["今回のアルカリ","30mL"]]}},{"id":"T12a","theme":"燃える気体と、燃焼を助ける気体","cat":"化学","q":"水素について正しい文をすべて選ぼう。理由も説明しよう。","cond":"水素について判断する。","a":"ア、ウ。","exp":"水素は空気より軽く、水に溶けにくい。水素自身は燃えるが、酸素のように他の物の燃焼を助ける気体ではない。石灰石と塩酸からは二酸化炭素が出る。","miss":"「自身が燃える」と「他の物を燃やすのを助ける」は別の性質。","fig":"","table":{"headers":["記号","文"],"rows":[["ア","空気より軽く、水に溶けにくい"],["イ","自身は燃えず、他の物の燃焼を助ける"],["ウ","鉄とうすい塩酸から発生する"],["エ","石灰石とうすい塩酸から発生する"]]}},{"id":"T12b","theme":"燃える気体と、燃焼を助ける気体","cat":"化学","q":"気体X・Y・Zは水素・酸素・二酸化炭素のどれか。図表から、それぞれの名前を答えよう。","cond":"3種類は1回ずつ使う。Xの燃焼試験は空気中での観察。","a":"X=水素、Y=酸素、Z=二酸化炭素。","exp":"水素は燃えて水になる。酸素は燃焼を助ける。二酸化炭素は石灰水を白くにごらせる。1つの観察ではなく、それぞれ別の性質を使って区別する。","miss":"酸素自身が燃える、と説明しない。","fig":"","table":{"headers":["気体","観察結果"],"rows":[["X","自身が燃え、水ができる"],["Y","火が消えかけた線香がよく燃える"],["Z","石灰水が白くにごる"]]}},{"id":"T13a","theme":"「すべての金属」に言える？","cat":"化学","q":"ア〜ウは、すべての金属に共通する性質？ それぞれに反例を挙げよう。","cond":"室温は20℃。","a":"すべて共通しない。ア：銅など。イ：水銀。ウ：ナトリウムなど。","exp":"銅は磁石に強く引きつけられない。水銀は20℃で液体。ナトリウムは水より密度が小さい。「多くの金属」で見た性質を「すべて」に広げない。","miss":"ナトリウムを水に入れる実験をする、という問題ではない。密度の比較で判断する。","fig":"","table":{"headers":["記号","金属すべてに共通する？"],"rows":[["ア","磁石に強く引きつけられる"],["イ","20℃で固体"],["ウ","水より密度が大きい"]]}},{"id":"T13b","theme":"「すべての金属」に言える？","cat":"化学","q":"Xは磁石に強く引きつけられない。これだけで「Xは金属ではない」と断定できる？ 金属の例も1つ挙げよう。","cond":"磁石への反応以外は調べていない。","a":"断定できない。銅、アルミニウム、金など。","exp":"金属の中にも、磁石に強く引きつけられないものがある。この観察だけでは金属かどうかを分類できない。","miss":"鉄の性質を、金属全体の定義にしない。","fig":"","table":{"headers":["観察したこと","磁石に強く引きつけられない"],"rows":[["未測定","電気を通すか／材質など"],["問い","金属ではないと断定できる？"]]}},{"id":"T14a","theme":"混合物の分離","cat":"化学","q":"食塩・銅・石灰石を混ぜ、十分な水で食塩を完全に溶かしてろ過した。ろ液と、ろ紙上の固体には何がある？","cond":"材料は純粋な物質。微量の溶解は無視する。溶けていない固体粒子はすべてろ紙に残る。","a":"ろ液には水と溶けた食塩。ろ紙上には銅と石灰石。","exp":"食塩は水に溶けるが、銅と石灰石はこの操作では水に溶けずに残る。ろ過で分けられるのは、液体と、その液体に溶けていない固体。水に溶けた食塩はろ紙を通る。","miss":"「食塩は固体だから、溶かした後もろ紙に残る」と考えない。","fig":"","table":{"headers":["初めの固体","食塩／銅／石灰石"],"rows":[["操作1","十分な水で食塩を完全に溶かす"],["操作2","ろ過する"]]}},{"id":"T14b","theme":"混合物の分離","cat":"化学","q":"銅と石灰石の混合物に、十分なうすい塩酸を加えて反応を終え、ろ過した。ろ紙に残る物は？ 元の石灰石をそのまま得るには、このろ液を蒸発させればよい？","cond":"材料は純粋な物質。うすい塩酸は十分な量を使い、反応が終わった後にろ過する。","a":"残るのは銅。蒸発させても元の石灰石はそのまま戻らない。","exp":"うすい塩酸は石灰石と反応するが、銅とは反応しない。石灰石は塩酸と反応して二酸化炭素など、別の物質になる。溶けただけの食塩とは違う。反応後のろ液から水を除いても、元の石灰石を取り出す操作にはならない。","miss":"水に溶かす操作と、化学反応で物質を変える操作を区別する。","fig":"","table":{"headers":["出発する固体","銅／石灰石"],"rows":[["加える液体","十分な量のうすい塩酸"],["次の操作","反応を終え、ろ過"]]}},{"id":"T15a","theme":"密閉容器で鉄を加熱","cat":"化学","q":"鉄5gを、酸素が0.8gだけある容器で加熱した。加熱後の固体の合計質量と、反応しなかった鉄の質量は？","cond":"この実験では鉄：結びつく酸素=21：8の質量比。酸素が使い切られるまで反応する。外へ物質は出ず、他の反応は起こらない。","a":"固体の合計5.8g。反応しなかった鉄2.9g。","exp":"酸素0.8gと結びつく鉄は0.8×21÷8=2.1g。酸化物2.9gと、残りの鉄2.9gで合計5.8g。すべての鉄が酸化したとは限らない。鉄と酸素の質量比はできる酸化物によって異なるので、この問題で示された比を使う。","miss":"加熱後の固体には、酸化物と未反応の鉄が混ざることがある。","fig":"","table":{"headers":["加熱前の鉄","5g"],"rows":[["使える酸素","0.8g"],["反応する質量比","鉄21：酸素8"]]}},{"id":"T15b","theme":"密閉容器で鉄を加熱","cat":"化学","q":"鉄5gに酸素1.2gを反応させた。その後、反応しなかった鉄だけを、酸化物を含まないようにすべて分け取った。この鉄に十分なうすい塩酸を加えると、水素は何cm³出る？","cond":"加熱では鉄：結びつく酸素=21：8の質量比。酸素はすべて使われ、他の反応は起こらない。純粋な鉄1gを十分なうすい塩酸と反応させると水素400cm³が出る。気体の体積は同じ温度・圧力で比べる。","a":"740cm³。","exp":"この問題では酸化物を除き、反応しなかった鉄だけを塩酸と反応させる。酸化物も混ぜたまま塩酸を加えると、別の反応で鉄が消費される場合があるので、この計算はそのまま使えない。酸化する鉄は1.2×21÷8=3.15g。反応しなかった鉄は5−3.15=1.85g。これをすべて分け取って塩酸と反応させるので、水素は1.85×400=740cm³。鉄と酸素の質量比はできる酸化物によって異なるので、この問題で示された比を使う。","miss":"加熱前の鉄全体や、加熱後の固体全体の質量を使わない。","fig":"","table":{"headers":["加熱前の鉄","5g"],"rows":[["使える酸素","1.2g"],["純粋な鉄1gからの水素","400cm³"]]}},{"id":"T16a","theme":"季節と太陽","cat":"天体","q":"季節で太陽の通り道や昼の長さが変わる理由を、地軸と公転を使って説明しよう。","cond":"日本の北緯35度で観測する。","a":"地軸が傾き、その向きをほぼ保ったまま地球が太陽の周りを公転するため。","exp":"地軸は約23.4度傾き、公転してもその向きはほぼ変わらない。公転で太陽に対する地軸の傾き方が変わり、同じ地点でも光の当たる角度や、明るい側にある時間が変わる。地軸の傾きだけ、公転だけ、のどちらか一方では説明が足りない。","miss":"傾きと、向きを保った公転を組にして説明する。","fig":"","table":{"headers":["時期","太陽の南中高度","昼の長さ"],"rows":[["夏至","高い","長い"],["冬至","低い","短い"]]}},{"id":"T16b","theme":"季節と太陽","cat":"天体","q":"もし地軸が公転面に垂直で、傾きが0度なら、北緯35度の太陽の南中高度は夏と冬で何度ずつ？ 昼の長さは季節で変わる？","cond":"地球を球とし、大気による光の曲がり・太陽の大きさ・地形は無視する。地軸は傾かず、その向きを保って公転する。","a":"夏も冬も55度。昼の長さは季節で変わらず、12時間。","exp":"太陽は年中、赤道の真上を通る位置関係になる。南中高度は90−35=55度。緯度35度では明暗の境界が緯線を半分ずつに分ける。","miss":"実際の地球の夏至・冬至の式へ、23.4度を残さない。","fig":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 340\" role=\"img\" aria-label=\"S：太陽、E：地球、A：地軸。地軸の向きだけを示す模式図。大きさ・距離は実際の比ではない。\"><defs><marker id=\"arrow\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4\" orient=\"auto\"><path d=\"M0 0 L8 4 L0 8\" fill=\"#007f83\"/></marker></defs><rect width=\"640\" height=\"340\" rx=\"8\" fill=\"white\"/><g font-family=\"sans-serif\" font-size=\"42\" fill=\"#16374b\"><circle cx=\"90\" cy=\"130\" r=\"35\" fill=\"#ffeab7\" stroke=\"#ad6b00\"/><path d=\"M140 130 H380\" stroke=\"#a6b4c0\" stroke-width=\"3\"/><circle cx=\"440\" cy=\"130\" r=\"53\" fill=\"#eaf3f8\" stroke=\"#164565\"/><path d=\"M440 55 V205\" stroke=\"#164565\" stroke-width=\"4\"/><text x=\"65\" y=\"270\">S</text><text x=\"415\" y=\"270\">E</text><text x=\"500\" y=\"70\">A</text></g></svg>","table":{"headers":["仮定の地軸の傾き","0度"],"rows":[["地点","北緯35度"],["無視するもの","光の曲がり／太陽の大きさ"]]}},{"id":"T17a","theme":"北極星が動きにくく見える理由","cat":"天体","q":"他の星が動いて見える中で、北極星はほとんど動かない。地球の自転と関係づけて説明しよう。","cond":"北極星も完全に静止して見えるわけではない。","a":"北極星が、地球の自転軸を北へ延ばした方向に近いから。","exp":"地球が自転すると、他の星は自転軸の延長方向を中心に動いて見える。北極星はその中心に近いため、動きが小さい。北にある星すべてが動かないわけではない。","miss":"「北の空にあるから」だけでは理由が不足する。","fig":"","table":{"headers":["観察したこと","北の空の星の動き"],"rows":[["他の多くの星","時間とともに位置が変わる"],["北極星","動きがごく小さい"]]}},{"id":"T17b","theme":"北極星が動きにくく見える理由","cat":"天体","q":"北緯30度から北緯45度へ移動すると、北極星のおよその高さはどう変わる？ ほとんど動かない理由も変わる？","cond":"平らな地平線からの高さを、整数の概数で答える。大気による光の曲がりは無視する。","a":"高さは約30度から約45度へ上がる。動きが小さい理由は変わらず、自転軸の延長方向に近いこと。","exp":"北極星の高さは観測地点の北緯とおよそ同じ。観測地点が変わっても、北極星が自転軸の延長方向に近い関係は変わらない。","miss":"空での高さと、時間とともに動く大きさを区別する。","fig":"","table":{"headers":["出発する地点","北緯30度"],"rows":[["移動後の地点","北緯45度"]]}},{"id":"T18a","theme":"色素を区別できる証拠は？","cat":"実験の推論","q":"液Ⅰだけでは区別できない色素の組は？ 液Ⅱも使うと、その組は区別できる？","cond":"数値は同じ条件で測った移動距離cm。測定誤差はない。","a":"液ⅠだけではPとR。液ⅡではP=2cm、R=5cmなので区別できる。","exp":"1つの液で同じ位置になっても、別の液では異なる位置になることがある。1点だけでなく、2つの測定値の組を比べる。","miss":"同じ位置の1つの点に、複数の色素が重なることがある。","fig":"","table":{"headers":["色素","液Ⅰ","液Ⅱ"],"rows":[["P","6cm","2cm"],["Q","4cm","5cm"],["R","6cm","5cm"]]}},{"id":"T18b","theme":"色素を区別できる証拠は？","cat":"実験の推論","q":"2種類の液を使っても、全色素を区別できない組を選ぼう。ア：ⅠとⅡ、イ：ⅠとⅢ、ウ：ⅡとⅢ。","cond":"数値は移動距離cm。測定誤差はない。","a":"イ。PとQがどちらも（液Ⅰ6cm、液Ⅲ4cm）になる。","exp":"ⅠとⅡ、ⅡとⅢでは、どの2つの色素も少なくとも1つの液で距離が違う。全員を区別するには、2つの値の組を全部比べる。","miss":"一部が分離したことだけで、全色素が区別できると判断しない。","fig":"","table":{"headers":["色素","液Ⅰ","液Ⅱ","液Ⅲ"],"rows":[["P","6cm","2cm","4cm"],["Q","6cm","5cm","4cm"],["R","3cm","5cm","7cm"]]}},{"id":"T19a","theme":"動物の分類","cat":"生物","q":"図表の動物のうち、昆虫をすべて選ぼう。","cond":"成虫の基本的な体のつくりで分類する。","a":"トンボ、ハエ。","exp":"昆虫の体は基本的に頭・胸・腹。クモは頭胸部と腹部に分かれ、ムカデも昆虫ではない。脚が多い小動物をすべて昆虫にしない。","miss":"昆虫以外を、見た目だけで混ぜない。","fig":"","table":{"headers":["選ぶ候補","トンボ／クモ"],"rows":[["選ぶ候補","ハエ／ムカデ"]]}},{"id":"T19b","theme":"動物の分類","cat":"生物","q":"表のP〜Sのうち、昆虫に分類できるものをすべて選ぼう。はねの有無だけで判断してよいかも答えよう。","cond":"成体の基本的な体のつくりを示す。あしの本数には触角を含めない。欠損した部分はない。","a":"PとR。はねの有無だけでは判断できない。","exp":"昆虫の基本的なつくりは、体が頭・胸・腹に分かれ、胸に3対（6本）のあしがあること。PとRはこれに当てはまる。はねがない昆虫もいるので、Rを除かない。Qはあしが8本、Sは多数あり、昆虫の基本的なつくりに当てはまらない。","miss":"はねがないことだけを理由に、昆虫ではないと判断しない。","fig":"","table":{"headers":["動物","体の区分","あし","はね"],"rows":[["P","頭・胸・腹","胸に6本","あり"],["Q","頭胸部・腹部","8本","なし"],["R","頭・胸・腹","胸に6本","なし"],["S","頭部・胴部","多数","なし"]]}},{"id":"T20a","theme":"川の岸と流れる水","cat":"地学","q":"川の曲がり角では、岸がけずられやすいのは内側・外側のどちら？ 土砂がたまりやすいのは？","cond":"典型的な曲がった川を考える。","a":"外側の岸がけずられやすい。内側に土砂がたまりやすい。","exp":"典型的な川の曲がり角では、外側の岸付近の流れが速く、内側は遅い。速い流れでは侵食が強くなりやすい。遅くなった流れでは運んでいた土砂がたい積しやすい。川のどの場所も同じ働きになるわけではない。","miss":"侵食・運搬・たい積を、流れの速さと結びつける。","fig":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 340\" role=\"img\" aria-label=\"矢印は流れる向き。川の形を示す模式図で、縮尺はない。\"><defs><marker id=\"arrow\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4\" orient=\"auto\"><path d=\"M0 0 L8 4 L0 8\" fill=\"#007f83\"/></marker></defs><rect width=\"640\" height=\"340\" rx=\"8\" fill=\"white\"/><g font-family=\"sans-serif\" font-size=\"42\" fill=\"#16374b\"><path d=\"M80 140 C240 -20 330 330 545 130\" fill=\"none\" stroke=\"#d2ebfa\" stroke-width=\"54\"/><path d=\"M80 140 C240 -20 330 330 545 130\" fill=\"none\" stroke=\"#164565\" stroke-width=\"3\" marker-end=\"url(#arrow)\"/></g></svg>","table":{"headers":["場所","川の曲がり角"],"rows":[["調べること","岸の侵食と土砂のたい積"]]}},{"id":"T20b","theme":"川の岸と流れる水","cat":"地学","q":"増水時に流れが速くなる岸を、コンクリートのブロックでおおった。岸に起こるどんな変化を防ぐため？","cond":"岸を補強する働きを説明する。","a":"速い流れによって岸がけずられたり、崩れたりするのを防ぐため。","exp":"岸の土や砂が流れに直接けずられにくくなるように、岸を保護する。「災害を防ぐ」だけより、流れの働きと岸の変化を具体的に書く。","miss":"防ぐ対象を、岸の侵食・崩れとして説明する。","fig":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 340\" role=\"img\" aria-label=\"矢印は流れる向き。川の形を示す模式図で、縮尺はない。\"><defs><marker id=\"arrow\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4\" orient=\"auto\"><path d=\"M0 0 L8 4 L0 8\" fill=\"#007f83\"/></marker></defs><rect width=\"640\" height=\"340\" rx=\"8\" fill=\"white\"/><g font-family=\"sans-serif\" font-size=\"42\" fill=\"#16374b\"><path d=\"M80 140 C240 -20 330 330 545 130\" fill=\"none\" stroke=\"#d2ebfa\" stroke-width=\"54\"/><path d=\"M80 140 C240 -20 330 330 545 130\" fill=\"none\" stroke=\"#164565\" stroke-width=\"3\" marker-end=\"url(#arrow)\"/></g></svg>","table":{"headers":["増水時","岸付近の流れが速くなる"],"rows":[["対策","岸をブロックでおおう"],["問い","岸のどんな変化を防ぐ？"]]}},{"id":"T21a","theme":"3色の光","cat":"物理","q":"光A・B・Cは赤・緑・青を1色ずつ使う。A+Bがマゼンタ、B+Cが黄になった。A・B・Cの色は？","cond":"赤・緑・青を1色ずつ使い、白い面に光を重ねる。絵の具の混色ではない。","a":"A=青、B=赤、C=緑。","exp":"マゼンタを作る組は赤と青、黄を作る組は赤と緑。共通するBは赤。残りを決めるとAは青、Cは緑。","miss":"2つの結果に共通する光から決める。","fig":"","table":{"headers":["重ねる光","見える色"],"rows":[["A＋B","マゼンタ"],["B＋C","黄"],["使用する3色","赤／緑／青"]]}},{"id":"T21b","theme":"3色の光","cat":"物理","q":"同じ3色の光で、A+Bがシアン、B+Cが黄になった。A・B・Cの色は？","cond":"赤・緑・青を1色ずつ使い、白い面に光を重ねる。","a":"A=青、B=緑、C=赤。","exp":"シアンは緑と青、黄は赤と緑。共通するBは緑。Aは青、Cは赤になる。Aと同じBの答えを覚えて使わない。","miss":"重なった色が1つ変わったとき、共通する光も変わる。","fig":"","table":{"headers":["重ねる光","見える色"],"rows":[["A＋B","シアン"],["B＋C","黄"],["使用する3色","赤／緑／青"]]}},{"id":"T22a","theme":"細胞の反応と色の区別","cat":"実験の推論","q":"3種類の光P・Q・Rを、細胞X・Yの反応の組で区別する。この表では全部区別できる？ 区別できない組も答えよう。","cond":"色を区別する仕組みを単純化した模型。光の種類は、表に記録された細胞の反応だけから判断する。測定誤差はない。","a":"全部は区別できない。PとQが区別できない。","exp":"PとQはどちらも（X=2、Y=1）。Rは（2、3）なので区別できる。細胞の種類が2つあるだけでは、すべて区別できる保証はない。","miss":"細胞ごとに値が違うかではなく、光ごとの反応の組を比べる。","fig":"","table":{"headers":["光","細胞X","細胞Y"],"rows":[["P","2","1"],["Q","2","1"],["R","2","3"]]}},{"id":"T22b","theme":"細胞の反応と色の区別","cat":"実験の推論","q":"細胞X・Y・Zの反応で、この3種類の光を全部区別できる？ Yが使えずX・Zだけになったら、全部区別できる？","cond":"光の種類は、利用できる細胞の反応値だけから判断する。この表の3種類の光だけを比較し、測定誤差はない。","a":"X・Y・Zなら全部区別できる。X・ZだけではPとRが区別できない。","exp":"3つの値ならP=(2,1,4)、Q=(2,1,5)、R=(2,3,4)で全部違う。Yを除くとPとRが(2,4)で一致する。細胞を除いたら、残りの値の組で再確認する。","miss":"一度区別できた結果を、条件が変わってもそのまま使わない。","fig":"","table":{"headers":["光","細胞X","細胞Y","細胞Z"],"rows":[["P","2","1","4"],["Q","2","1","5"],["R","2","3","4"]]}},{"id":"N1a","theme":"北の空の星","cat":"天体","q":"星が今Kにある。6時間後、図のA〜Lのうち最も近い位置を選ぼう。","cond":"地球の公転による影響は無視する。星の動きは概数で考える。","a":"B。","exp":"地球の自転と星の日周運動は、1時間に約15度として考える。北の空では反時計回りに動く。6時間で90度、30度の区間を3つ進む。K→L→A→B。","miss":"進む向きと、Aをまたぐ数え方。","fig":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 460\"><rect width=\"640\" height=\"460\" fill=\"white\"/><g fill=\"#173c54\" font-family=\"DejaVu Sans, sans-serif\"><circle cx=\"320\" cy=\"210\" r=\"145\" fill=\"white\" stroke=\"#173c54\" stroke-width=\"3\"/><circle cx=\"320\" cy=\"210\" r=\"5\" fill=\"white\" stroke=\"#173c54\" stroke-width=\"3\"/><text x=\"320\" y=\"248\" text-anchor=\"middle\" font-size=\"20\">P</text><circle cx=\"465.0\" cy=\"210.0\" r=\"5\" fill=\"white\" stroke=\"#173c54\" stroke-width=\"3\"/><text x=\"497.0\" y=\"216.0\" text-anchor=\"middle\" font-size=\"20\">A</text><circle cx=\"445.57\" cy=\"137.5\" r=\"5\" fill=\"white\" stroke=\"#173c54\" stroke-width=\"3\"/><text x=\"473.29\" y= えない。黒丸・小円の分岐点では導線がつながる。","a":"A ＞ C ＞ D＝X ＞ B（消灯）。","exp":"Bの両端は導線で直結され、Bに電流は流れない。UはQと同じ電圧になる。Aは電池に直接つながる枝。もう一方はCと、D・Xの並列部分の直列。Cを流れる電流はDとXに半分ずつ分かれる。一定抵抗のモデルで、電流比はA:C:D:X＝3:2:1:1。","miss":"図の上下ではなく、導線で直結された点をまとめる。","fig":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 460\"><rect width=\"640\" height=\"460\" fill=\"white\"/><g fill=\"#173c54\" font-family=\"DejaVu Sans, sans-serif\"><line x1=\"60\" y1=\"120\" x2=\"182\" y2=\"120\" stroke=\"#173c54\" stroke-width=\"3\" /><circle cx=\"200\" cy=\"120\" r=\"18\" fill=\"white\" stroke=\"#173c54\" stroke-width=\"3\"/><line x1=\"190\" y1=\"110\" x2=\"210\" y2=\"130\" stroke=\"#173c54\" stroke-width=\"3\" /><line x1=\"190\" y1=\"130\" x2=\"210\" y2=\"110\" stroke=\"#173c54\" stroke-width=\"3\" /><text x=\"200\" y=\"91\" text-anchor=\"middle\" font-size=\"20\">A</text><line x1=\"218\" y1=\"120\" x2=\"422\" y2=\"120\" stroke=\"#173c54\" stroke-width=\"3\" /><circle cx=\"440\" cy=\"120\" r=\"18\" fill=\"white\" stroke=\"#173c54\" stroke-width=\"3\"/><line x1=\"430\" y1=\"110\" x2=\"450\" y2=\"130\" stroke=\"#173c54\" stroke-width=\"3\" /><line x1=\"430\" y1=\"130\" x2=\"450\" y2=\"110\" stroke=\"#173c54\" stroke-width=\"3\" /><text x=\"440\" y=\"91\" text-anchor=\"middle\" font-size=\"20\">B</text><line x1=\"458\" y1=\"120\" x2=\"580\" y2=\"120\" stroke=\"#173c54\" stroke-width=\"3\" /><line x1=\"60\" y1=\"300\" x2=\"182\" y2=\"300\" stroke=\"#173c54\" stroke-width=\"3\" /><circle cx=\"200\" cy=\"300\" r=\"18\" fill=\"white\" stroke=\"#173c54\" stroke-width=\"3\"/><line x1=\"190\" y1=\"290\" x2=\"210\" y2=\"310\" stroke=\"#173c54\" stroke-width=\"3\" /><line x1=\"190\" y1=\"310\" x2=\"210\" y2=\"290\" stroke=\"#173c54\" stroke-width=\"3\" /><text x=\"200\" y=\"271\" text-anchor=\"middle\" font-size=\"20\">C</text><line x1=\"218\" y1=\"300\" x2=\"422\" y2=\"300\" stroke=\"#173c54\" stroke-width=\"3\" /><circle cx=\"440\" cy=\"300\" r=\"18\" fill=\"white\" stroke=\"#173c54\" stroke-width=\"3\"/><line x1=\"430\" y1=\" ,324.3636363636364 92,306.54545454545456 68,288.72727272727275 92,270.9090909090909 68,253.0909090909091 92,235.27272727272725 68,217.45454545454547 92,199.63636363636363 68,181.8181818181818 92,164.0 80,164 80,154\" fill=\"none\" stroke=\"#173c54\" stroke-width=\"3\"/><text x=\"80\" y=\"414\" text-anchor=\"middle\" font-size=\"20\">A</text><polyline points=\"560,370 560,360 548,360.0 572,342.1818181818182 548,324.3636363636364 572,306.54545454545456 548,288.72727272727275 572,270.9090909090909 548,253.0909090909091 572,235.27272727272725 548,217.45454545454547 572,199.63636363636363 548,181.8181818181818 572,164.0 560,164 560,154\" fill=\"none\" stroke=\"#173c54\" stroke-width=\"3\"/><text x=\"560\" y=\"414\" text-anchor=\"middle\" font-size=\"20\">B</text><text x=\"80\" y=\"47\" text-anchor=\"middle\" font-size=\"18\">50 g -&gt; 5 cm</text><text x=\"560\" y=\"47\" text-anchor=\"middle\" font-size=\"18\">50 g -&gt; 2.5 cm</text><text x=\"320\" y=\"440\" text-anchor=\"middle\" font-size=\"20\">board: 30 g</text><text x=\"320\" y=\"285\" text-anchor=\"middle\" font-size=\"20\">W = ?   x = ?</text></g></svg>","table":null},{"id":"M2b","theme":"板と2本のばね","cat":"力学","q":"板の高さが17cmになった。おもりの重さWと、板の左端からの距離xを求めよう。","cond":"一様な板の長さは40cm、重さは30g。両端を鉛直なばねA・Bだけで支える。自然長はどちらも20cm。Aは50gで5cm、Bは50gで2.5cm縮む。縮みと支える重さは比例する。ばねの重さは考えない。板の上に点として扱うおもりを1個置き、板が水平で静止した。板にほかの支えや案内はない。高さはばねを置いた共通の底面から板の下面（ばねの上端）まで測る。","a":"W＝60g、x＝30cm。","exp":"両ばねが3cm縮むので、Aは30g、Bは60gを支える。合計90gから板の30gを引き、W＝60g。左端まわりで60×40＝30×20＋60×x。x＝30cm。","miss":"板の重心を消して、おもりだけでつり合いを考えない。","fig":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 460\"><rect width=\"640\" height=\"460\" fill=\"white\"/><g fill=\"#173c54\" font-family=\"DejaVu Sans, sans-serif\"><line x1=\"45\" y1=\"370\" x2=\"595\" y2=\"370\" stroke=\"#173c54\" stroke-width=\"3\" /><rect x=\"80\" y=\"150\" width=\"480\" height=\"16\" fill=\"#edf5f6\" stroke=\"#173c54\" stroke-width=\"2\"/><line x1=\"80\" y1=\"130\" x2=\"560\" y2=\"130\" stroke=\"#173c54\" stroke-width=\"3\" stroke-dasharray=\"6 6\"/><text x=\"320\" y=\"112\" text-anchor=\"middle\" font-size=\"20\">20 cm</text><text x=\"600\" y=\"172\" text-anchor=\"middle\" font-size=\"18\">17 cm</text><polyline points=\"80,370 80,360 68,360.0 92,343.27272727272725 68,326.54545454545456 92,309.8181818181818 68,293.0909090909091 92,276.3636363636364 68,259.6363636363636 92,242.9090909090909 68,226.1818181818182 92,209.45454545454547 68,192.72727272727272 92,176.0 80,176 80,166\" fill=\"none\" stroke=\"#173c54\" stroke-width=\"3\"/><text x=\"80\" y=\"414\" text-anchor=\"middle\" font-size=\"20\">A</text><polyline points=\"560,370 560,360 548,360.0 572,343.27272727272725 548,326.54545454545456 572,309.8181818181818 548,293.0909090909091 572,276.3636363636364 548,259.6363636363636 572,242.9090909090909 548,226.1818181818182 572,209.45454545454547 548,192.72727272727272 572,176.0 560,176 560,166\" fill=\"none\" stroke=\"#173c54\" stroke-width=\"3\"/><text x=\"560\" y=\"414\" text-anchor=\"middle\" font-size=\"20\">B</text><text x=\"80\" y=\"47\" text-anchor=\"middle\" font-size=\"18\">50 g -&gt; 5 cm</text><text x=\"560\" y=\"47\" text-anchor=\"middle\" font-size=\"18\">50 g -&gt; 2.5 cm</text><text x=\"320\" y=\"440\" text-anchor=\"middle\" font-size=\"20\">board: 30 g</text><text x=\"320\" y=\"285\" text-anchor=\"middle\" font-size=\"20\">W = ?   x = ?</text></g></svg>","table":null},{"id":"C1a","theme":"水溶液の冷却と蒸発","cat":"化学","q":"水溶液180gを、そのまま20℃まで冷やした。出る結晶と、残る水溶液はそれぞれ何g？","cond":"物質Xは水に溶かしても別の物質にならず、冷やすと結晶だけが出る。60℃でXが限度まで溶けた水溶液180gを使う。指定された蒸発操作以外では、水は蒸発しない。蒸発操作では水だけが蒸発し、Xは蒸発しない。結晶には水が含まれない。十分待ってその温度での限度まで溶かす。こぼしたり、ろ紙に水溶液が残ったりする量は考えない。表はこの問題のXの性質を定めたもの。","a":"結晶60g、水溶液120g。","exp":"60℃では水100g＋X80g＝180g。20℃でも水は100gのままなのでX20gだけが溶ける。結晶は80−20＝60g、水溶液は100＋20＝120g。","miss":"溶解度の基準は、水溶液100gではなく水100g。","fig":"","table":{"headers":["温度","水100gに溶けるXの最大量"],"rows":[["20℃","20g"],["60℃","80g"]]}},{"id":"C1b","theme":"水溶液の冷却と蒸発","cat":"化学","q":"60℃のまま水20gを蒸発させ、出た結晶を60℃でろ過して取り除いた。そのろ液を20℃まで冷やす。最初のろ過で取れる結晶と、その後の冷却で出る結晶はそれぞれ何g？","cond":"物質Xは水に溶かしても別の物質にならず、冷やすと結晶だけが出る。60℃でXが限度まで溶けた水溶液180gを使う。指定された蒸発操作以外では、水は蒸発しない。蒸発操作では水だけが蒸発し、Xは蒸発しない。結晶には水が含まれない。十分待ってその温度での限度まで溶かす。こぼしたり、ろ紙に水溶液が残ったりする量は考えない。表はこの問題のXの性質を定めたもの。","a":"最初16g、その後48g。","exp":"水が80gになると60℃で溶けるXは64g。最初に80−64＝16gが出て取り除かれる。ろ液は水80g＋X64g。20℃ではX16gが溶けるので、冷却で64−16＝48gが出る。","miss":"途中のろ過で取り除いた結晶を、次の計算に戻さない。","fig":"","table":{"headers":["温度","水100gに溶けるXの最大量"],"rows":[["20℃","20g"],["60℃","80g"]]}},{"id":"C2a","theme":"大理石と塩酸","cat":"化学","q":"大理石2gに塩酸30mLを加えた。気体は何cm³出る？ 反応後の大理石は何g残る？","cond":"純粋な大理石とうすい塩酸から出る気体の体積を表に示す。塩酸の濃さ・気体の温度と圧力は同じ。十分に反応させ、気体はすべて集める。大理石か塩酸が使い切られるまで反応し、使われる量と気体の体積は比例する。","a":"気体180cm³、大理石0.5g。","exp":"表から、大理石1gで120cm³、塩酸20mLで最大120cm³と分かる。塩酸30mLでは最大180cm³で、大理石1.5gが反応する。2−1.5＝0.5g残る。","miss":"大理石と塩酸の両方から上限を求め、小さい方を使う。","fig":"","table":{"headers":["うすい塩酸","大理石0.5g","1g","2g","3g"],"rows":[["20mL","60cm³","120cm³","120cm³","120cm³"],["40mL","60cm³","120cm³","240cm³","240cm³"]]}},{"id":"C2b","theme":"大理石と塩酸","cat":"化学","q":"大理石と砂の混合物を、同じ割合・同じ重さの3gずつの2試料に分けた。一方は塩酸40mLで気体240cm³、他方は80mLで300cm³出た。各試料の大理石と砂はそれぞれ何g？ 40mLの結果だけでは決められない理由も答えよう。","cond":"純粋な大理石とうすい塩酸から出る気体の体積を表に示す。塩酸の濃さ・気体の温度と圧力は同じ。十分に反応させ、気体はすべて集める。大理石か塩酸が使い切られるまで反応し、使われる量と気体の体積は比例する。この実験で用いる砂は塩酸と反応しないものとする。","a":"各試料は大理石2.5g、砂0.5g。40mLでは塩酸が上限になるため、240cm³だけから大理石の正確な量は決められない。","exp":"塩酸80mLの上限は480cm³。試料が全部大理石でも3×120＝360cm³なので、80mLでは塩酸が足りる。300÷120＝2.5gが大理石。40mLの上限は240cm³で、大理石が2g以上なら同じ体積になる。","miss":"気体の量が同じでも、固体の量が同じとは限らない。","fig":"","table":{"headers":["うすい塩酸","大理石0.5g","1g","2g","3g"],"rows":[["20mL","60cm³","120cm³","120cm³","120cm³"],["40mL","60cm³","120cm³","240cm³","240cm³"]]}},{"id":"B1a","theme":"水草と酸素","cat":"生物","q":"20℃で光を2時間当て、その後1時間暗くした。①光合成でつくられた酸素の合計、②3時間を通じた酸素の増加量は、それぞれ何mL？","cond":"同じ量の水草を使う。各温度で呼吸による酸素の消費量は、光の有無にかかわらず同じとする。光の強さや二酸化炭素などの条件はそろえ、各条件の増減量は時間に比例する。ほかの生物や気体の出入りはない。酸素の体積は、すべて同じ温度・圧力にそろえて測った値とする。＋は酸素の増加、−は減少。","a":"①16mL、②7mL。","exp":"20℃の呼吸は1時間に3mL消費。光があるときの増加5mLは、生成から消費を引いた値なので、生成は5＋3＝8mL/時。2時間で16mL生成。全体の増減は5×2−3＝7mL。","miss":"明るいときにも呼吸が続いている。","fig":"","table":{"headers":["温度","光","1時間の酸素の増減"],"rows":[["20℃","なし","−3mL"],["20℃","あり","＋5mL"],["30℃","なし","−4mL"],["30℃","あり","＋8mL"]]}},{"id":"B1b","theme":"水草と酸素","cat":"生物","q":"20℃から30℃へ変えると、1時間に光合成でつくられる酸素は何mL増える？ 光がある行どうしの差だけで決められない理由も答えよう。","cond":"同じ量の水草を使う。各温度で呼吸による酸素の消費量は、光の有無にかかわらず同じとする。光の強さや二酸化炭素などの条件はそろえ、各条件の増減量は時間に比例する。ほかの生物や気体の出入りはない。酸素の体積は、すべて同じ温度・圧力にそろえて測った値とする。＋は酸素の増加、−は減少。","a":"4mL増える。温度を変えると、呼吸の消費量も変わるため。","exp":"20℃の生成量は5＋3＝8mL、30℃は8＋4＝12mL。生成量の差は4mL。測れた増加量の差3mLには、呼吸の消費が1mL増えた効果も含まれる。","miss":"温度以外の条件をそろえ、暗い条件の測定も使う。","fig":"","table":{"headers":["温度","光","1時間の酸素の増減"],"rows":[["20℃","なし","−3mL"],["20℃","あり","＋5mL"],["30℃","なし","−4mL"],["30℃","あり","＋8mL"]]}},{"id":"B2a","theme":"鉢植えの水分","cat":"生物","q":"土から、葉から、葉と土以外から出た水は、1時間にそれぞれ何g？ 比べる鉢の組も示そう。","cond":"同じ種類・大きさの鉢植えを使い、1時間の重さの減少を調べた。水やりはせず、水分が出ること以外で重さは変わらない。土を覆うと土からだけ水が出なくなる。すべての葉の両面を覆うと葉からだけ水が出なくなる。覆う操作は、覆っていない部分から出る水の量を変えないものとする。光・温度・風などはそろえる。","a":"土8g（I−II）、葉20g（II−III）、葉と土以外2g（III）。","exp":"IとIIは土を覆うかだけが違うので30−22＝8g。IIとIIIは葉を覆うかだけが違うので22−2＝20g。IIIでも減る2gは、茎など葉と土以外から出る水。","miss":"鉢全体の減少を、すべて葉の蒸散として数えない。","fig":"","table":{"headers":["鉢","土","すべての葉の両面","減った重さ"],"rows":[["I","覆わない","覆わない","30g"],["II","覆う","覆わない","22g"],["III","覆う","覆う","2g"]]}},{"id":"B2b","theme":"鉢植えの水分","cat":"生物","q":"別の実験では、4つの鉢すべての土を覆った。葉の表側と裏側から出る水は、1時間にそれぞれ何g？ この結果を、すべての植物に当てはめてよい？","cond":"同じ種類・大きさの鉢植えを使い、1時間の重さの減少を調べた。水やりはせず、水分が出ること以外で重さは変わらない。土を覆うと土からだけ水が出なくなる。すべての葉の両面を覆うと葉からだけ水が出なくなる。覆う操作は、覆っていない部分から出る水の量を変えないものとする。光・温度・風などはそろえる。 葉の表側か裏側だけを覆うと、その面からだけ水が出なくなるものとする。","a":"表側4g、裏側16g。すべての植物に同じ割合を当てはめることはできない。","exp":"表側は22−18＝4g（または6−2）、裏側は22−6＝16g（または18−2）。覆った鉢で残る減少量ではなく、覆う前との差を使う。調べた種類・条件以外の割合は、この実験では測っていない。","miss":"「覆った面」と「水が出た面」を取り違えない。","fig":"","table":{"headers":["鉢","すべての葉の表側","すべての葉の裏側","減った重さ"],"rows":[["I","覆わない","覆わない","22g"],["II","覆う","覆わない","18g"],["III","覆わない","覆う","6g"],["IV","覆う","覆う","2g"]]}},{"id":"G1a","theme":"地震波の到着","cat":"地学","q":"AとBの震源からの距離、および地震が起きた時刻を求めよう。","cond":"P波は秒速6km、S波は秒速4kmで、震源から同時に出て各観測点へ一定の速さで伝わるものとする。時計は正確にそろっている。距離は震央からではなく震源から測る。","a":"Aは60km、Bは120km。発生は12時00分00秒。","exp":"同じ距離12kmならP波は2秒、S波は3秒かかり、差は1秒。Aの差5秒から60km、Bの差10秒から120km。AではP波が10秒、Bでは20秒かかるので、どちらも発生時刻は12:00:00。","miss":"P波の到着時刻を、地震発生時刻にしない。","fig":"","table":{"headers":["観測点","P波の到着","S波の到着"],"rows":[["A","12:00:10","12:00:15"],["B","12:00:20","12:00:30"]]}},{"id":"G1b","theme":"地震波の到着","cat":"地学","q":"BのS波の記録だけが12:00:29になった。この表のAとBを、同じ地震の記録として説明できる？ 発生時刻を両方から求めて判断しよう。","cond":"P波は秒速6km、S波は秒速4kmで、震源から同時に出て各観測点へ一定の速さで伝わるものとする。時計は正確にそろっている。距離は震央からではなく震源から測る。","a":"説明できない。Aからは12:00:00、Bからは12:00:02になる。","exp":"Bの時間差9秒から震源距離は108km。P波の移動時間は108÷6＝18秒なので、発生は12:00:20の18秒前＝12:00:02。Aの発生12:00:00と一致しない。与えた条件の下では同じ地震ではない。","miss":"1地点だけの計算ではなく、複数の記録の矛盾を確かめる。","fig":"","table":{"headers":["観測点","P波の到着","S波の到着"],"rows":[["A","12:00:10","12:00:15"],["B","12:00:20","12:00:29"]]}},{"id":"G2a","theme":"地層の標高","cat":"地学","q":"P・Q・Rで、Tの標高はそれぞれ何m？ PとQの中間にあるSの地表は標高95m。Sでは、Tまで何m掘ればよい？","cond":"P・Q・Rは水平距離100mずつ離れて一直線に並ぶ。Tは1回の噴火でできた同じ薄い火山灰層で、厚さは考えない。断層でずれていない区域では、この直線に沿ってTの標高は、距離に比例して変わるものとする。P・Q・Rは断層でずれていない。 Sに断層による変位はない。","a":"Tの標高はP88m、Q82m、R76m。Sでは10m。","exp":"標高＝地表の標高−深さ。Pは100−12＝88、Qは90−8＝82、Rは80−4＝76。P・Qの中間ではTの標高85m。Sの地表95mから95−85＝10m掘る。","miss":"深さどうしを比べる前に、同じ標高の基準に直す。","fig":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 460\"><rect width=\"640\" height=\"460\" fill=\"white\"/><g fill=\"#173c54\" font-family=\"DejaVu Sans, sans-serif\"><rect x=\"50\" y=\"70\" width=\"100\" height=\"230\" fill=\"#edf5f6\" stroke=\"#173c54\" stroke-width=\"2\"/><line x1=\"50\" y1=\"166\" x2=\"150\" y2=\"166\" stroke=\"#173c54\" stroke-width=\"3\" /><text x=\"100\" y=\"47\" text-anchor=\"middle\" font-size=\"20\">P</text><text x=\"100\" y=\"191\" text-anchor=\"middle\" font-size=\"20\">T</text><text x=\"100\" y=\"350\" text-anchor=\"middle\" font-size=\"20\">100 m</text><text x=\"100\" y=\"383\" text-anchor=\"middle\" font-size=\"20\">12 m< <script>
/* ==== engine.js ==== */
// 筑駒理科ジム 計算エンジン
// 力学（てこ）と電気回路を厳密に解く。生成した問題の正答はすべてここで計算する。
// ⛔ 推測で答えを作らない。すべて解析解・線形代数で出す。

// ============================================================
// 1. 回路ソルバー（union-find + 節点解析）
// ============================================================
// 回路の表し方:
//   nodes: 文字列の配列
//   elems: [{type:'bulb'|'wire'|'switch', a, b, id, closed?}]
//   battery: {a, b, emf}   a が＋極、b が−極
// 豆電球の抵抗は 1、導線と閉じたスイッチの抵抗は 0 とする（中学受験の標準）。

function solveCircuit(nodes, elems, battery) {
  // --- 0抵抗（導線・閉じたスイッチ・電池）でつながる節点を統合する ---
  const parent = {};
  nodes.forEach(n => parent[n] = n);
  const find = x => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
  const union = (x, y) => { const rx = find(x), ry = find(y); if (rx !== ry) parent[rx] = ry; };

  for (const e of elems) {
    if (e.type === 'wire') union(e.a, e.b);
    if (e.type === 'switch' && e.closed) union(e.a, e.b);
  }

  const posR = find(battery.a), negR = find(battery.b);
  if (posR === negR) {
    // 電池の両極が0抵抗で短絡している。中学受験では扱わない形。
    return { shorted: true, bulbs: {} };
  }

  // --- 残った節点のうち、電池の両極以外を未知数にする ---
  const reps = [...new Set(nodes.map(find))];
  const unknown = reps.filter(r => r !== posR && r !== negR);
  const idx = {}; unknown.forEach((r, i) => idx[r] = i);
  const N = unknown.length;

  // 豆電球だけが抵抗を持つ
  const bulbs = elems.filter(e => e.type === 'bulb').map(e => ({ ...e, ra: find(e.a), rb: find(e.b) }));

  // G * V = I （節点解析）。電池の両極は既知電圧（emf, 0）
  const G = Array.from({ length: N }, () => new Array(N).fill(0));
  const I = new Array(N).fill(0);
  const V_known = r => (r === posR ? battery.emf : 0);

  for (const b of bulbs) {
    if (b.ra === b.rb) continue;           // 導線で短絡された豆電球（電流0）
    const g = 1 / (b.R ?? 1);
    for (const [p, q] of [[b.ra, b.rb], [b.rb, b.ra]]) {
      if (idx[p] !== undefined) {
        G[idx[p]][idx[p]] += g;
        if (idx[q] !== undefined) G[idx[p]][idx[q]] -= g;
        else I[idx[p]] += g * V_known(q);
      }
    }
  }

  const V = gauss(G, I);
  const volt = r => (idx[r] !== undefined ? (V ? V[idx[r]] : 0) : V_known(r));

  const out = {};
  for (const b of bulbs) {
    const cur = (b.ra === b.rb) ? 0 : Math.abs(volt(b.ra) - volt(b.rb)) / (b.R ?? 1);
    out[b.id] = round(cur, 6);
  }
  // 電池を流れる電流（豆電球の電流から、＋極につながる枝を合計）
  let batt = 0;
  for (const b of bulbs) {
    if (b.ra === b.rb) continue;
    if (b.ra === posR || b.rb === posR) batt += out[b.id];
  }
  return { shorted: false, bulbs: out, batteryCurrent: round(batt, 6) };
}

// ガウスの消去法（部分ピボット選択）
function gauss(A, b) {
  const n = b.length;
  if (n === 0) return [];
  const M = A.map((row, i) => [...row, b[i]]);
  for (let c = 0; c < n; c++) {
    let p = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    if (Math.abs(M[p][c]) < 1e-12) return null;   // 解けない（孤立した枝など）
    [M[c], M[p]] = [M[p], M[c]];
    for (let r = 0; r < n; r++) {
      if (r === c) continue;
      const f = M[r][c] / M[c][c];
      if (f === 0) continue;
      for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k];
    }
  }
  return M.map((row, i) => row[n] / row[i]);
}

const round = (x, d) => Math.round(x * 10 ** d) / 10 ** d;

// 明るさの順位を文字列にする（E1a の「A＝B＝C＝D ＞ X（消灯）」と同じ形）
function brightnessOrder(bulbCurrents) {
  const eps = 1e-9;
  const entries = Object.entries(bulbCurrents).sort((p, q) => q[1] - p[1]);
  const groups = [];
  for (const [id, cur] of entries) {
    const last = groups[groups.length - 1];
    if (last && Math.abs(last.cur - cur) < eps) last.ids.push(id);
    else groups.push({ cur, ids: [id] });
  }
  return groups.map(g => {
    const names = g.ids.sort().join('＝');
    return g.cur < eps ? `${names}（つかない）` : names;
  }).join(' ＞ ');
}

// ============================================================
// 2. 力学: 棒が倒れる境目（筑駒の定番型）
// ============================================================
// 一様な棒（長さ L・重さ W・重心は中央）を台にのせる。台の右端＝支点が左端から p。
// おもり w を左端から x に置く。x を右へ動かすと、いつ倒れるか。
//   支える側のモーメント  : W * (p - L/2)        ※ p > L/2 のとき棒は自力で安定
//   倒す側のモーメント    : w * (x - p)
//   境目 : x = p + W * (p - L/2) / w
function leverTipping({ L, W, p, w }) {
  if (!(p > L / 2)) return { valid: false, why: '支点が重心より左にあるため、おもりなしで倒れる' };
  const x = p + (W * (p - L / 2)) / w;
  return {
    valid: true,
    x: round(x, 6),
    onBar: x < L,                       // 境目が棒の上にあるか（右端ちょうどは不安定なので除外）
    verdict: x < L ? '倒れる' : '棒の上では倒れない',
    detail: { supportMoment: W * (p - L / 2), formula: `x = ${p} + ${W}×(${p}−${L / 2})÷${w}` }
  };
}

// 軽い棒のつりあい（重さを考えなくてよい棒。左の w1g×d1cm と右の ?g×d2cm がつりあう）
function leverBalance({ w1, d1, d2 }) { return round(w1 * d1 / d2, 6); }

// 両端を支える力（距離の逆比）
function twoSupports({ L, W, w, x }) {
  // 左端と右端で支える。棒の重心 L/2、おもり w が位置 x
  const right = (W * (L / 2) + w * x) / L;
  return { left: round(W + w - right, 6), right: round(right, 6) };
}

// ばね（自然長 L0・k g/cm で伸びる）
function spring({ L0, gPerCm, w }) {
  return { stretch: round(w / gPerCm, 6), total: round(L0 + w / gPerCm, 6) };
}

// 同じばねを切ったとき（自然長に比例して伸びやすさが変わる）
function springCut({ L0, gPerCm, newL0, w }) {
  const k2 = gPerCm * (L0 / newL0);     // 短いほど伸びにくい＝必要な重さが増える
  return { stretch: round(w / k2, 6), total: round(newL0 + w / k2, 6) };
}

// ============================================================
// 2.5 水溶液（溶解度）— 筑駒の最頻出。表の数値は問題文の中で示すので、外の知識を使わない
// ============================================================
// 溶解度 S = 水100g にとける重さ(g)

// 高い温度でとけるだけとかし、低い温度まで冷やしたときに出てくる結晶
function solCrystal({ S1, S2, water }) { return round((S1 - S2) * water / 100, 6); }

// 水にある重さを入れたときの、とけ残り
function solLeftover({ S, water, added }) {
  const max = S * water / 100;
  return { max: round(max, 6), left: round(Math.max(0, added - max), 6) };
}

// とけるだけとかした水溶液を蒸発させたときに残る固体
function solResidue({ S, sat }) { return round(sat * S / (100 + S), 6); }

// ある重さを全部とかすのに必要な水
function solWaterNeeded({ S, solid }) { return round(solid / S * 100, 6); }

// とけるだけとかした水溶液の濃さ（％）
function solPercent({ S }) { return round(S / (100 + S) * 100, 6); }

// ============================================================
// 2.6 端子に導線を1本足す（筑駒2023・2024型）
// ============================================================
// terminals: 端子名の配列。baseElems: 固定の豆電球など。battery: 電池のつなぎ先。
// 2つの端子を導線で結ぶ全部の組を試し、ついていない豆電球を数えて返す。
function boardOptions(terminals, baseElems, battery) {
  const out = [];
  for (let i = 0; i < terminals.length; i++) {
    for (let j = i + 1; j < terminals.length; j++) {
      const elems = baseElems.concat([{ type: 'wire', a: terminals[i], b: terminals[j] }]);
      const r = solveCircuit(terminals, elems, battery);
      const label = `${i + 1}と${j + 1}`;
      if (r.shorted) { out.push({ i, j, label, shorted: true }); continue; }
      const ids = Object.keys(r.bulbs).sort();
      const off = ids.filter(x => r.bulbs[x] < 1e-9);
      out.push({ i, j, label, shorted: false, bulbs: r.bulbs, off, offCount: off.length, ids });
    }
  }
  return out;
}

// ============================================================
// 3. 自己点検（対照実験を含む）
// ============================================================
function selfTest() {
  const results = [];
  const t = (name, got, want, note = '') => {
    const ok = JSON.stringify(got) === JSON.stringify(want);
    results.push({ name, ok, got, want, note });
  };

  // --- 回路: 教科書の既知の値 ---
  // (1) 豆電球1個
  t('豆電球1個の電流', solveCircuit(['p', 'n'], [{ type: 'bulb', a: 'p', b: 'n', id: 'A' }], { a: 'p', b: 'n', emf: 1 }).bulbs, { A: 1 });

  // (2) 直列2個 → それぞれ 0.5
  t('直列2個', solveCircuit(['p', 'm', 'n'], [
    { type: 'bulb', a: 'p', b: 'm', id: 'A' }, { type: 'bulb', a: 'm', b: 'n', id: 'B' }
  ], { a: 'p', b: 'n', emf: 1 }).bulbs, { A: 0.5, B: 0.5 });

  // (3) 並列2個 → それぞれ 1、電池は 2
  const par = solveCircuit(['p', 'n'], [
    { type: 'bulb', a: 'p', b: 'n', id: 'A' }, { type: 'bulb', a: 'p', b: 'n', id: 'B' }
  ], { a: 'p', b: 'n', emf: 1 });
  t('並列2個の各電流', par.bulbs, { A: 1, B: 1 });
  t('並列2個のとき電池を流れる電流は2倍', par.batteryCurrent, 2);

  // (4) ショート: B に並列に導線 → B は消灯、A は1個のときと同じ
  t('導線で短絡した豆電球は消灯', solveCircuit(['p', 'm', 'n'], [
    { type: 'bulb', a: 'p', b: 'm', id: 'A' },
    { type: 'bulb', a: 'm', b: 'n', id: 'B' },
    { type: 'wire', a: 'm', b: 'n' }
  ], { a: 'p', b: 'n', emf: 1 }).bulbs, { A: 1, B: 0 });

  // (5) 1個 + 並列2個 → 1/1.5 と 1/3 ずつ
  const mix = solveCircuit(['p', 'm', 'n'], [
    { type: 'bulb', a: 'p', b: 'm', id: 'A' },
    { type: 'bulb', a: 'm', b: 'n', id: 'B' },
    { type: 'bulb', a: 'm', b: 'n', id: 'C' }
  ], { a: 'p', b: 'n', emf: 1 }).bulbs;
  t('直列1個＋並列2個', [round(mix.A, 3), round(mix.B, 3), round(mix.C, 3)], [0.667, 0.333, 0.333]);

  // (6) 明るさの並べ方の表示
  t('明るさの順（同じ明るさと、つかないもの）', brightnessOrder({ A: 1, B: 1, C: 0.5, X: 0 }), 'A＝B ＞ C ＞ X（つかない）');

  // --- 🔴 対照実験: 試験が失敗を検出できることを示す（CLAUDE.md §10.3） ---
  // 直列2個を「それぞれ1」と誤って期待したら、必ず失敗すること
  const ctrl1 = JSON.stringify(solveCircuit(['p', 'm', 'n'], [
    { type: 'bulb', a: 'p', b: 'm', id: 'A' }, { type: 'bulb', a: 'm', b: 'n', id: 'B' }
  ], { a: 'p', b: 'n', emf: 1 }).bulbs) === JSON.stringify({ A: 1, B: 1 });
  results.push({ name: '【対照実験】直列2個を1.0と誤認したら不一致になる', ok: ctrl1 === false, got: ctrl1, want: false });

  // --- 力学: 既存カード M1 と一致するか ---
  // M1a: 80g のおもり → 境目は左端から55cm、倒れる
  // M1b: 40g のおもり → 計算上の境目は70cm で棒の外（棒の上では倒れない）
  // この2つから棒は L=60cm・W=120g・支点 p=40cm と定まる（連立して解いた）
  const m1a = leverTipping({ L: 60, W: 120, p: 40, w: 80 });
  t('M1a 境目55cm・倒れる', [m1a.x, m1a.verdict], [55, '倒れる']);
  const m1b = leverTipping({ L: 60, W: 120, p: 40, w: 40 });
  t('M1b 境目70cm・棒の上では倒れない', [m1b.x, m1b.verdict], [70, '棒の上では倒れない']);

  // 【対照実験】支点が重心より左なら、おもりなしで倒れると判定されること
  t('【対照実験】支点が重心の左なら不成立', leverTipping({ L: 60, W: 120, p: 25, w: 80 }).valid, false);

  // --- 両端支持: 距離の逆比 ---
  t('棒の中央におもり→左右半分ずつ', twoSupports({ L: 100, W: 0, w: 100, x: 50 }), { left: 50, right: 50 });
  t('棒の右端におもり→右だけで支える', twoSupports({ L: 100, W: 0, w: 100, x: 100 }), { left: 0, right: 100 });

  // --- ばね: T09a と一致するか ---
  // T09a: 自然長30cmに切ったばねに20gで全長42cm → 伸び12cm（切る前の条件から導かれる値）
  t('ばね 20gで12cm伸びる→全長42cm', spring({ L0: 30, gPerCm: 20 / 12, w: 20 }), { stretch: 12, total: 42 });

  // --- 両端で支える: 距離の逆比・解説の式と一致するか（finding 1 の正答） ---
  // L=100, W=120, w=60, x=20 → 左端まわりで W*L/2 + w*x = right*L なので right=72, left=108
  t('両端で支える L=100,W=120,w=60,x=20', twoSupports({ L: 100, W: 120, w: 60, x: 20 }), { left: 108, right: 72 });

  // --- 境目がちょうど棒の右端にある組は、棒の上の問題として採用しない（finding 7） ---
  // L=60, W=100, p=35, w=20 → x = 35 + 100*(35-30)/20 = 60（右端ぴったり）
  t('境目が棒の右端ぴったりなら onBar は false', leverTipping({ L: 60, W: 100, p: 35, w: 20 }).onBar, false);

  // --- 日付のローカル計算（finding 5 の addDays 相当） ---
  // ここで直接 addDays を呼べないので、閏月とタイムゾーン相当の計算が合うかを数値で見る
  const dAdd = (d, n) => { const t = new Date(d + 'T00:00:00'); t.setDate(t.getDate() + n); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`; };
  t('addDays ローカル日付で3日後', dAdd('2026-10-03', 3), '2026-10-06');
  t('addDays 月をまたぐ', dAdd('2026-01-30', 3), '2026-02-02');


  // --- 水溶液（溶解度）---
  // 60℃で30g、20℃で10g とける物質を、水100g で考える
  t('冷やして出る結晶（水100g）', solCrystal({ S1: 30, S2: 10, water: 100 }), 20);
  t('冷やして出る結晶（水150g）', solCrystal({ S1: 30, S2: 10, water: 150 }), 30);
  t('とけ残り（水100gに40g入れ、とける量30g）', solLeftover({ S: 30, water: 100, added: 40 }), { max: 30, left: 10 });
  t('全部とけるときのとけ残りは0', solLeftover({ S: 30, water: 100, added: 20 }), { max: 30, left: 0 });
  t('とけるだけとかした水溶液130gを蒸発（S=30）', solResidue({ S: 30, sat: 130 }), 30);
  t('60gを全部とかすのに必要な水（S=30）', solWaterNeeded({ S: 30, solid: 60 }), 200);
  t('とけるだけとかした水溶液の濃さ（S=25）', solPercent({ S: 25 }), 20);

  // 【対照実験】冷やす前と後のとける量が同じなら、結晶は出ないこと
  t('【対照実験】とける量が変わらなければ結晶は0', solCrystal({ S1: 30, S2: 30, water: 100 }), 0);

  // --- 端子に導線を1本足す: 既存カード E2a / E2b の答えを再現するか ---
  // 豆電球A(端子1-2)・B(2-3)・C(3-4) が直列。電池は端子1と4。
  const T4 = ['t1', 't2', 't3', 't4'];
  const B3 = [
    { type: 'bulb', a: 't1', b: 't2', id: 'A' },
    { type: 'bulb', a: 't2', b: 't3', id: 'B' },
    { type: 'bulb', a: 't3', b: 't4', id: 'C' },
  ];
  const e2a = boardOptions(T4, B3, { a: 't1', b: 't4', emf: 1 })
    .filter(o => !o.shorted && o.offCount === 2).map(o => o.label).join('、');
  t('E2a 電池が端子1と4のとき、消灯2個になる組', e2a, '1と3、2と4');
  const e2b = boardOptions(T4, B3, { a: 't1', b: 't3', emf: 1 })
    .filter(o => !o.shorted && o.offCount === 2).map(o => o.label).join('、');
  t('E2b 電池が端子1と3のとき、消灯2個になる組', e2b, '1と2、2と3');
  // 電池を短絡させる組が1つだけ検出されること（1と4）
  t('電池が短絡する組を除外できる',
    boardOptions(T4, B3, { a: 't1', b: 't4', emf: 1 }).filter(o => o.shorted).map(o => o.label), ['1と4']);

  // 【対照実験】誤った答えを期待したら不一致になること
  t('【対照実験】E2aの答えを取り違えたら不一致', e2a === '1と2、3と4', false);

  // --- 軽い棒のつりあい ---
  t('軽い棒のつりあい 30g×20cm ＝ ?g×15cm', leverBalance({ w1: 30, d1: 20, d2: 15 }), 40);
  t('【対照実験】つりあいの式を取り違えたら不一致', leverBalance({ w1: 30, d1: 20, d2: 15 }) === 30, false);
  return results;
}

// Node で直接走らせたときだけ自己点検を出す
if (typeof module !== 'undefined' && require.main === module) {
  const r = selfTest();
  let ng = 0;
  for (const x of r) {
    if (!x.ok) ng++;
    console.log(`${x.ok ? 'OK  ' : 'NG  '} ${x.name}`);
    if (!x.ok) console.log(`       got=${JSON.stringify(x.got)}  want=${JSON.stringify(x.want)}`);
  }
  console.log(`\n${r.length - ng}/${r.length} 合格`);
  process.exit(ng ? 1 : 0);
}

if (typeof module !== 'undefined') {
  module.exports = { solveCircuit, brightnessOrder, leverTipping, leverBalance, twoSupports, spring, springCut,
    solCrystal, solLeftover, solResidue, solWaterNeeded, solPercent, boardOptions, selfTest };
}

<script>
/* ============================================================
   筑駒理科ジム
   診断（筑駒2024実物40分で76点／失点は 力学-7・実験考察-6・回路-6・すべて選べ-4）
   に合わせて、訓練する対象を4つに絞ってある。
   ⛔ 正答はすべて engine.js が計算する。アプリ内に手書きの答えを置かない。
   ============================================================ */

const $ = s => document.querySelector(s);
const el = (t, a = {}, ...kids) => {
  const n = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (k === 'class') n.className = v; else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
};
// 日付はローカル（日本時間）で組み立てる。toISOString() を使うと UTC で丸められて、
// 日本時間の 0〜9時に「今日」が前日になり、addDays が1日少なく出る（finding 5）。
const fmtDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => fmtDate(new Date());
const addDays = (d, n) => { const t = new Date(d + 'T00:00:00'); t.setDate(t.getDate() + n); return fmtDate(t); };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1800); }

/* ---------------- 記録（localStorage） ---------------- */
const KEY = 'tsukukoma-rika-gym-v1';
const DEFAULT = { v: 1, items: {}, log: [], exams: [], goal: 76 };
let DB = load();
function load() {
  try { const r = JSON.parse(localStorage.getItem(KEY)); if (r && r.v) return Object.assign({}, DEFAULT, r); } catch (e) { }
  return JSON.parse(JSON.stringify(DEFAULT));
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { toast('記録を保存できませんでした'); } }

// 分散復習の間隔。① Cepeda et al.(2008) は「本番までの残り日数の10〜20%」が最適と報告。
// 本番まで約120日なので 12〜25日。間違えたものは短く、できたものは長くする。
const STEPS = [3, 7, 14, 21];
function grade(key, ok) {
  const it = DB.items[key] || (DB.items[key] = { seen: 0, ok: 0, ng: 0, step: 0, due: today() });
  it.seen++;
  if (ok) { it.ok++; it.step = Math.min(it.step + 1, STEPS.length - 1); }
  else { it.ng++; it.step = 0; }
  it.due = addDays(today(), STEPS[it.step]);
  it.last = today();
  save();
}
function isDue(key) { const it = DB.items[key]; return !it || it.due <= today(); }
function logSession(mode, n, ok) {
  const d = today();
  let r = DB.log.find(x => x.d === d && x.mode === mode);
  if (!r) { r = { d, mode, n: 0, ok: 0 }; DB.log.push(r); }
  r.n += n; r.ok += ok; save();
}
function streakDays() {
  const days = [...new Set(DB.log.filter(x => x.n > 0).map(x => x.d))].sort().reverse();
  let s = 0, d = today();
  if (!days.includes(d)) d = addDays(d, -1);
  while (days.includes(d)) { s++; d = addDays(d, -1); }
  return s;
}

/* ============================================================
   生成: 力学（てこ）
   ============================================================ */
function genLever() {
  // ① 筑駒の力学は8年中8年が「てこ・てんびん・積み重ね」。ばね・滑車は8年間出ていないので入れない。
  // 2021・2023年度はつりあいの数値計算が中心（10問・9問）、2024・2026年度は「倒れない条件」。
  const kind = pick(['balance', 'balance', 'tip', 'tip', 'tipYN']);
  if (kind === 'balance') {
    // 軽い棒（重さを考えなくてよい棒）のつりあい。筑駒2021・2023の基本形
    for (let t = 0; t < 200; t++) {
      const d1 = pick([10, 15, 20, 25, 30, 40]);
      const w1 = pick([20, 30, 40, 60, 80, 120]);
      const d2 = pick([10, 15, 20, 25, 30, 40, 50, 60]);
      if (d2 === d1) continue;
      const w2 = leverBalance({ w1, d1, d2 });
      if (!Number.isInteger(w2) || w2 < 10 || w2 > 400) continue;
      if (Math.random() < 0.5) {
        return {
          key: 'lever:bal-w', kind, topic: 'てこ（つりあいの計算）',
          q: '重さを考えなくてよい棒を、糸で1点つるした。つるした点から左へ ' + d1 + 'cm のところに ' + w1 + 'g のおもりを下げた。つるした点から右へ ' + d2 + 'cm のところに何 g のおもりを下げると、棒は水平につりあうか。',
          hint: '（おもりの重さ）×（つるした点からのきょり）が、左と右で等しくなるとつりあう。',
          unit: 'g', ans: w2,
          exp: '左側: ' + w1 + '×' + d1 + '＝' + (w1 * d1) + '。\n右側も ' + (w1 * d1) + ' になればつりあう。\n□×' + d2 + '＝' + (w1 * d1) + ' より □＝' + w2 + 'g。',
          svg: svgBalance(d1, w1, d2, '？g'),
        };
      } else {
        return {
          key: 'lever:bal-d', kind, topic: 'てこ（つりあいの計算）',
          q: '重さを考えなくてよい棒を、糸で1点つるした。つるした点から左へ ' + d1 + 'cm のところに ' + w1 + 'g のおもりを下げた。' + w2 + 'g のおもりを右側のどこに下げると、棒は水平につりあうか。つるした点からのきょりを答えよ。',
          hint: '（おもりの重さ）×（つるした点からのきょり）が、左と右で等しくなるとつりあう。',
          unit: 'cm', ans: d2,
          exp: '左側: ' + w1 + '×' + d1 + '＝' + (w1 * d1) + '。\n' + w2 + '×□＝' + (w1 * d1) + ' より □＝' + d2 + 'cm。',
          svg: svgBalance(d1, w1, null, w2 + 'g'),
        };
      }
    }
  }
  // 倒れる境目（筑駒2024・2026の「倒れない条件」型）
  for (let t = 0; t < 400; t++) {
    const L = pick([60, 80, 100]);
    const a = pick([5, 10, 15, 20]);                   // 支点 − 重心
    const p = L / 2 + a;
    if (p >= L) continue;
    const w = pick([20, 30, 40, 50, 60, 80, 100]);
    const m = pick([5, 10, 15, 20, 25, 30, 40]);        // W×a÷w ＝ 支点から境目までのきょり
    const W = m * w / a;
    if (!Number.isInteger(W) || W < 40 || W > 400) continue;
    const r = leverTipping({ L, W, p, w });
    if (!r.valid) continue;
    if (kind !== 'tipYN') {
      if (!r.onBar) continue;
      return {
        key: 'lever:tip', kind: 'tip', topic: 'てこ（倒れる境目）',
        q: '長さ ' + L + 'cm・重さ ' + W + 'g の太さが同じ棒を台にのせた。台の右はしは、棒の左はしから ' + p + 'cm のところにある。' + w + 'g のおもりを棒の上で右へ動かしていくと、やがて棒はかたむいて倒れる。倒れる境目は、棒の左はしから何 cm のところか。',
        hint: '台の右はしが支点。棒の重さは真ん中（重心）に全部かかっていると考える。（重さ）×（支点からのきょり）が左右で等しくなるところが境目。',
        unit: 'cm', ans: r.x,
        exp: '棒の重心は左はしから ' + (L / 2) + 'cm。支点（台の右はし）は ' + p + 'cm なので、重心は支点より ' + a + 'cm 左にある。\n'
          + '棒が支える側: ' + W + '×' + a + '＝' + (W * a) + '。\nおもりがかたむける側: ' + w + '×(□−' + p + ')。\n'
          + w + '×(□−' + p + ')＝' + (W * a) + ' より □−' + p + '＝' + m + '、□＝' + r.x + 'cm。',
        svg: svgLever(L, W, p, w, r.x),
      };
    } else {
      const put = r.onBar ? pick([Math.min(L, Math.ceil(r.x) + pick([3, 5, 8])), Math.max(p + 1, Math.floor(r.x) - pick([3, 5, 8]))]) : pick([p + 5, L - 5]);
      if (put <= p || put >= L) continue;
      if (put === r.x) continue;
      const falls = put > r.x;
      return {
        key: 'lever:tipYN', kind, topic: 'てこ（倒れるか）',
        q: '長さ ' + L + 'cm・重さ ' + W + 'g の太さが同じ棒を台にのせた。台の右はしは棒の左はしから ' + p + 'cm。' + w + 'g のおもりを、棒の左はしから ' + put + 'cm のところにのせた。棒は倒れるか。',
        hint: 'まず境目を計算してから、のせたところがそれより右か左かを見る。',
        choice: ['倒れる', '倒れない'], ans: falls ? '倒れる' : '倒れない',
        exp: '棒の重心は左はしから ' + (L / 2) + 'cm、支点は ' + p + 'cm なので、重心は支点より ' + a + 'cm 左。\n'
          + '境目は ' + p + '＋' + W + '×' + a + '÷' + w + '＝' + r.x + 'cm。のせたのは ' + put + 'cm なので、境目より' + (falls ? '右。よって倒れる' : '左。よって倒れない') + '。',
        svg: svgLever(L, W, p, w, null, put),
      };
    }
  }
  return genLever();
}
function svgLever(L, W, p, w, boundary, put) {

/* ============================================================
   生成: 回路（答えは engine.js が計算）
   ============================================================ */
function circuitStates(c) {
  const sws = c.elems.filter(e => e.type === 'switch').map(e => e.id);
  const out = [];
  const n = 1 << sws.length;
  for (let i = 0; i < n; i++) {
    const st = {}; sws.forEach((s, k) => st[s] = !!(i >> k & 1));
    const elems = c.elems.map(e => e.type === 'switch' ? { ...e, closed: !!st[e.id] } : e);
    const r = solveCircuit(c.nodes, elems, c.battery);
    if (r.shorted) continue;            // 電池の短絡は出題しない
    out.push({ st, r, label: sws.map(s => `${s}を${st[s] ? '閉じた' : '開いた'}`).join('、') || 'スイッチなし' });
  }
  return out;
}
const CIRCUIT_POOL = (() => {
  const pool = [];
  for (const c of CIRCUITS) for (const s of circuitStates(c)) pool.push({ c, ...s });
  return pool;
})();

// ---- 端子に導線を1本つなぐ問題（筑駒2023・2024型。既存カード E2a・E2b と同じ形）----
// 豆電球A(端子1-2)・B(2-3)・C(3-4)。電池のつなぎ先を変えた3種類。答えは boardOptions が総当たりで計算する。
const BOARD_T = ['t1', 't2', 't3', 't4'];
const BOARD_BULBS = [
  { type: 'bulb', a: 't1', b: 't2', id: 'A' },
  { type: 'bulb', a: 't2', b: 't3', id: 'B' },
  { type: 'bulb', a: 't3', b: 't4', id: 'C' },
];
const BOARDS = (() => {
  const list = [];
  for (const [ba, bb, name] of [['t1', 't4', '1と4'], ['t1', 't3', '1と3'], ['t2', 't4', '2と4']]) {

    const usable = opts.filter(o => !o.shorted);          // 電池がショートする組は選択肢に入れない
    const ans2 = usable.filter(o => o.offCount === 2);
    if (ans2.length === 0 || ans2.length === usable.length) continue;   // 問題として成立するものだけ
    list.push({ batName: name, batA: ba, batB: bb, usable, ans2 });
  }
  return list;
})();

// 問題型（off/bright/batt）を重み 4:4:2 で先に選び、その型が作れる状態だけから抽選する。
// 以前は状態を先に選んでいたため、batt だけが候補のケースが多く約6割が batt に偏っていた（finding 20）。
const CIRCUIT_KINDS = ['off', 'bright', 'batt', 'board'];
const CIRCUIT_WEIGHT = { off: 3, bright: 3, batt: 2, board: 3 };
const CIRCUIT_POOLS = (() => {
  const clean = { 0.5: 1, 1: 1, 1.5: 1, 2: 1, 3: 1, 4: 1 };
  const pools = { off: [], bright: [], batt: [], board: BOARDS };
  for (const b of CIRCUIT_POOL) {
    const ids = Object.keys(b.r.bulbs).sort();
    const off = ids.filter(i => b.r.bulbs[i] < 1e-9);
    const maxCur = Math.max(...ids.map(i => b.r.bulbs[i]));
    const brightest = ids.filter(i => Math.abs(b.r.bulbs[i] - maxCur) < 1e-9 && maxCur > 1e-9);
    // 「ついていないものを選べ」は豆電球3個以上のときだけ（2個では選ぶ意味がないため）
    if (ids.length >= 3 && off.length >= 1 && off.length < ids.length) pools.off.push(b);
    // 「もっとも明るいものを選べ」は、豆電球3個以上で、最も明るいもの以外にも
    // ついている豆電球があるときだけ（残りが全部つかないなら、裏返しの同じ問題になるため）
    const others = ids.filter(i => !brightest.includes(i));
    const othersLit = others.some(i => b.r.bulbs[i] > 1e-9);
    if (ids.length >= 3 && brightest.length >= 1 && brightest.length < ids.length && othersLit) pools.bright.push(b);
    if (clean[Number(b.r.batteryCurrent.toFixed(3))]) pools.batt.push(b);
  }
  return pools;
})();

function genCircuit() {
  const kinds = CIRCUIT_KINDS.filter(k => CIRCUIT_POOLS[k].length);
  const totalW = kinds.reduce((s, k) => s + CIRCUIT_WEIGHT[k], 0);
  let rnd = Math.random() * totalW, kind = kinds[0];
  for (const k of kinds) { rnd -= CIRCUIT_WEIGHT[k]; if (rnd <= 0) { kind = k; break; } }
  const base = pick(CIRCUIT_POOLS[kind]);
  if (kind === 'board') {
    const b2 = base;
    return {
      topic: '回路（端子に導線をつなぐ）',
      svg: '<svg viewBox="0 0 540 240" role="img" aria-label="回路の図">' + svgBoard(b2.batA, b2.batB) + '</svg>',
      cond: '豆電球A・B・Cは同じもの。電池は端子' + b2.batName + 'につながっている。',
      key: 'circ:board:' + b2.batName,
      q: '2つの端子を導線で1本つなぐ。つかない豆電球がちょうど2個になるつなぎ方を、すべて選べ。',
      hint: '1組ずつ順番に試す。導線だけでつながった輪の中にある豆電球には、電流が流れない。',
      selectAll: {
        opts: b2.usable.map(o => '端子' + o.label),
        ans: b2.usable.map((o, i) => o.offCount === 2 ? i : -1).filter(i => i >= 0),
      },
      exp: b2.usable.map(o => '端子' + o.label + ' … つかないのは ' + (o.offCount ? o.off.join('・') + '（' + o.offCount + '個）' : 'なし')).join('\n')
        + '\n（電池がショートしてしまう組は、つないではいけないので選択肢にない）',
    };
  }
  const { c, st, r, label } = base;
  const ids = Object.keys(r.bulbs).sort();
  const off = ids.filter(i => r.bulbs[i] < 1e-9);
  const maxCur = Math.max(...ids.map(i => r.bulbs[i]));
  const brightest = ids.filter(i => Math.abs(r.bulbs[i] - maxCur) < 1e-9 && maxCur > 1e-9);
  const ratio = r.batteryCurrent;
  const clean = { 0.5: '0.5倍', 1: '1倍', 1.5: '1.5倍', 2: '2倍', 3: '3倍', 4: '4倍' };
  const svg = `<svg viewBox="0 0 500 280" role="img" aria-label="回路の図">${c.svg(st)}</svg>`;
  const common = { topic: `回路（${c.title}）`, svg, cond: `${label}。豆電球はすべて同じもの。` };

  if (kind === 'off') return {
    ...common, key: `circ:${c.id}:${JSON.stringify(st)}:off`,
    q: 'ついていない豆電球をすべて選べ。',
    hint: '① 開いたスイッチがある道には、電流が流れない。② 導線（または閉じたスイッチ）だけでつながっている道があると、そこに並んだ豆電球には電流が流れない。',
    selectAll: { opts: ids, ans: off.map(i => ids.indexOf(i)) },
    exp: expCircuit(ids, r),
  };
  if (kind === 'bright') return {
    ...common, key: `circ:${c.id}:${JSON.stringify(st)}:bright`,
    q: 'もっとも明るい豆電球をすべて選べ。',
    hint: '流れる電流が大きいほど明るい。同じ電流なら同じ明るさ。',
    selectAll: { opts: ids, ans: brightest.map(i => ids.indexOf(i)) },
    exp: expCircuit(ids, r),
  };
  const key = Number(ratio.toFixed(3));
  return {
    ...common, key: `circ:${c.id}:${JSON.stringify(st)}:batt`,
    q: '電池を流れる電流は、豆電球1個と電池1個だけをつないだときの何倍か。',
    hint: '豆電球を並列につなぐと電池から出る電流は増える。電池を直列にすると電流は増える。',
    choice: ['0.5倍', '1倍', '1.5倍', '2倍', '3倍', '4倍'], ans: clean[key],
    exp: expCircuit(ids, r) + `\n電池を流れる電流は ${ratio} 倍。`,
  };
}
// 回路は問題型が17種類しかないため、同じ練習セッション内で重複を避ける（finding 6）。
function genCircuitBatch(n) {
  const seen = new Set();
  const out = [];
  for (let i = 0; i < n; i++) {
    let q = null;
    for (let t = 0; t < 80; t++) {
      const g = genCircuit();
      if (!seen.has(g.key)) { q = g; break; }
    }
    if (!q) q = genCircuit();           // 候補を使い切ったら重複OK（配線5種・17型なので8問までは余裕）
    seen.add(q.key);
    out.push(q);
  }
  return out;
}
function expCircuit(ids, r) {
  const f = x => (Math.abs(x) < 1e-9 ? '0（つかない）' : (Math.round(x * 1000) / 1000).toString());
  return '電流の大きさ（豆電球1個のときを1とする）\n'
    + ids.map(i => `  ${i} … ${f(r.bulbs[i])}`).join('\n')
    + `\n明るい順: ${brightnessOrder(r.bulbs)}`;
}

/* ============================================================
   生成: 水溶液（とける量の計算）— ① 筑駒で8年中3年が計算問題として出題。
   表の数値は問題文の中で見せるので、覚えていない知識は使わない。
   答えは engine.js（solCrystal / solLeftover / solWaterNeeded）が計算する。
   ============================================================ */
function genSol() {
  for (let t = 0; t < 400; t++) {
    // とける量の表（水100gにとける重さ）。0℃から80℃へ増えていく表を作る
    const s0 = pick([4, 5, 6, 8, 10]);
    const steps = [pick([3, 4, 6]), pick([6, 8, 10]), pick([10, 12, 15]), pick([15, 20, 25])];
    const S = { 0: s0, 20: s0 + steps[0], 40: s0 + steps[0] + steps[1], 60: s0 + steps[0] + steps[1] + steps[2], 80: s0 + steps[0] + steps[1] + steps[2] + steps[3] };
    const table = {
      headers: ['水の温度（℃）', '0', '20', '40', '60', '80'],
      rows: [['とける重さ（g）', String(S[0]), String(S[20]), String(S[40]), String(S[60]), String(S[80])]],
    };
    const cond = '表は、水 100g にとける固体Aの重さを示している。';
    const kind = pick(['crystal', 'crystal', 'leftover', 'water', 'satW']);
    if (kind === 'crystal') {
      const water = pick([50, 100, 150, 200]);
      const hi = pick([60, 80]), lo = pick([20, 40].filter(x => x < hi));
      const ans = solCrystal({ S1: S[hi], S2: S[lo], water });
      if (!Number.isInteger(ans) || ans <= 0) continue;
      return {
        key: 'sol:crystal', topic: '水溶液（とける量の計算）', table, cond,
        q: hi + '℃の水 ' + water + 'g に固体Aをとけるだけとかした。この水よう液を ' + lo + '℃まで冷やすと、とけきれなくなって出てくる固体Aは何 g か。',
        hint: '出てくる固体＝（' + hi + '℃でとけていた量）−（' + lo + '℃でとける量）。水が100gでないときは、とける量も同じ割合で変わる。',
        unit: 'g', ans,
        exp: '水 ' + water + 'g にとける量は、表の値の ' + (water / 100) + ' 倍。\n'
          + hi + '℃: ' + S[hi] + '×' + (water / 100) + '＝' + (S[hi] * water / 100) + 'g がとけていた。\n'
          + lo + '℃: ' + S[lo] + '×' + (water / 100) + '＝' + (S[lo] * water / 100) + 'g までしかとけない。\n'
          + '出てくる固体＝' + (S[hi] * water / 100) + '−' + (S[lo] * water / 100) + '＝' + ans + 'g。',
      };
    }
    if (kind === 'leftover') {
      const water = pick([50, 100, 200]);
      const temp = pick([20, 40, 60]);
      const r = solLeftover({ S: S[temp], water, added: 0 });
      const max = r.max;
      if (!Number.isInteger(max)) continue;
      const added = max + pick([5, 8, 10, 12, 15]);
      return {
        key: 'sol:leftover', topic: '水溶液（とける量の計算）', table, cond,
        q: temp + '℃の水 ' + water + 'g に固体Aを ' + added + 'g 入れて、よくかきまぜた。とけ残る固体Aは何 g か。',
        hint: 'まず「この水に何gまでとけるか」を計算する。とけ残り＝入れた量−とける量。',
        unit: 'g', ans: added - max,
        exp: '水 ' + water + 'g にとける量は ' + S[temp] + '×' + (water / 100) + '＝' + max + 'g。\n'
          + 'とけ残り＝' + added + '−' + max + '＝' + (added - max) + 'g。',
      };
    }
    if (kind === 'water') {
      const temp = pick([20, 40, 60]);
      const mult = pick([1.5, 2, 2.5, 3]);
      const solid = S[temp] * mult;
      const ans = solWaterNeeded({ S: S[temp], solid });
      if (!Number.isInteger(solid) || !Number.isInteger(ans)) continue;
      return {
        key: 'sol:water', topic: '水溶液（とける量の計算）', table, cond,
        q: '固体A ' + solid + 'g を ' + temp + '℃の水にすべてとかしたい。水は少なくとも何 g いるか。',
        hint: '水100gに ' + S[temp] + 'g とける。' + solid + 'g は その何倍かを考える。',
        unit: 'g', ans,
        exp: solid + '÷' + S[temp] + '＝' + (solid / S[temp]) + ' 倍。\n水も同じ割合でいるので 100×' + (solid / S[temp]) + '＝' + ans + 'g。',
      };
    }
    // satW: とけるだけとかした水よう液の重さ
    const water = pick([50, 100, 200]);
    const temp = pick([40, 60, 80]);
    const max = S[temp] * water / 100;
    if (!Number.isInteger(max)) continue;
    return {
      key: 'sol:satw', topic: '水溶液（とける量の計算）', table, cond,
      q: temp + '℃の水 ' + water + 'g に固体Aをとけるだけとかした。この水よう液の重さは何 g か。',
      hint: '水よう液の重さ＝水の重さ＋とけた固体の重さ。とけて見えなくなっても、重さはなくならない。',
      unit: 'g', ans: water + max,
      exp: 'とけた固体Aは ' + S[temp] + '×' + (water / 100) + '＝' + max + 'g。\n水よう液の重さ＝' + water + '＋' + max + '＝' + (water + max) + 'g。',
    };

/* ============================================================
   出題キューを作る（診断の失点に比例して重みづけ＋単元を混ぜる）
   ① Rohrer et al.(2020): 問題を混ぜて練習すると正答率61% vs まとめて38%（d=0.83）
   ============================================================ */
const WEIGHT = { lever: 0.25, circuit: 0.22, sol: 0.20, select: 0.23, card: 0.10 };
function buildQueue(n) {
  const counts = {}; let left = n;
  const kinds = Object.keys(WEIGHT);
  kinds.forEach((k, i) => { const c = i === kinds.length - 1 ? left : Math.max(1, Math.round(n * WEIGHT[k])); counts[k] = Math.min(c, left); left -= counts[k]; });
  const buckets = {};
  // すべて選べ: 期限が来たものを優先
  const sa = [...SELECTALL].sort((a, b) => (isDue(a.id) ? 0 : 1) - (isDue(b.id) ? 0 : 1) || Math.random() - .5);
  buckets.select = sa.slice(0, counts.select).map(makeSelectQ);
  // ミス帳: 期限が来たものを優先
  const cd = [...CARDS].sort((a, b) => (isDue(a.id) ? 0 : 1) - (isDue(b.id) ? 0 : 1) || Math.random() - .5);
  buckets.card = cd.slice(0, counts.card).map(makeCardQ);
  buckets.lever = Array.from({ length: counts.lever }, genLever);
  buckets.sol = Array.from({ length: counts.sol }, genSol);
  buckets.circuit = genCircuitBatch(counts.circuit);
  // 同じ種類が連続しないように並べる
  const order = [];
  const pools = kinds.map(k => ({ k, arr: buckets[k] || [] }));
  while (pools.some(p => p.arr.length)) {
    const avail = pools.filter(p => p.arr.length);
    avail.sort((a, b) => b.arr.length - a.arr.length);
    const last = order.length ? order[order.length - 1].kindTag : null;
    const choice = avail.find(p => p.k !== last) || avail[0];
    const q = choice.arr.shift(); q.kindTag = choice.k; order.push(q);
  }
  return order;
}
function makeSelectQ(s) {
  return {
    key: s.id, topic: `すべて選べ（${s.cat}）`, q: s.q, table: s.table,
    selectAll: { opts: s.opts, ans: s.ans }, exp: s.exp, src: s.src,
    hint: '選択肢を1つずつ、他を見ずに○か×に決める。迷うものは？にして最後に戻る。',
  };
}
function makeCardQ(c) {
  return {
    key: c.id, topic: `ミス帳（${c.cat}）`, q: c.q, cond: c.cond, table: c.table, figSvg: c.fig,
    recall: { answer: c.a, exp: c.exp, miss: c.miss },
    hint: '口で答えてから、めくる。',
  };
}

  else q = [...CARDS].sort((a, b) => (isDue(a.id) ? 0 : 1) - (isDue(b.id) ? 0 : 1) || Math.random() - .5).slice(0, n).map(makeCardQ);
  q.forEach(x => x.kindTag = x.kindTag || only || 'mix');

/* ---- すべて選べ: 1つずつ○×△を付けないと採点できない（ここが訓練の本体） ---- */
function renderSelectAll(area, q) {
  const judged = new Array(q.selectAll.opts.length).fill(null);
  const rows = [];
  q.selectAll.opts.forEach((o, i) => {
    const bs = {};
    const row = el('div', { class: 'optrow' },
      el('div', { class: 'ot' }, `${'アイウエオカキクケコサシ'[i] || i + 1}　${o}`),
      el('div', { class: 'ob' },
        bs.o = el('button', { class: 'jb', onclick: () => set(i, 'o') }, '○'),
        bs.x = el('button', { class: 'jb', onclick: () => set(i, 'x') }, '×'),
        bs.q = el('button', { class: 'jb', onclick: () => set(i, 'q') }, '？'),
      ));
    rows.push({ row, bs }); area.append(row);
  });
  const note = el('p', { class: 'tiny' }, 'すべての選択肢に ○ か × をつけると、答え合わせができます。迷うものは ？ にして最後に決めてください。');
  const cnt = el('p', { class: 'muted' }, '');

  area.append(note, cnt, btn);

    const n = judged.filter(x => x === 'o').length, un = judged.filter(x => x == null || x === 'q').length;
    cnt.textContent = `○をつけた数 ${n} 個` + (un ? `　／ まだ決めていないもの ${un} 個` : '');
    btn.disabled = judged.some(x => x == null || x === 'q');

  function judge() {
    const ans = new Set(q.selectAll.ans);
    let allOk = true;
    judged.forEach((v, i) => {
      const should = ans.has(i) ? 'o' : 'x';
      const ok = v === should;
      if (!ok) allOk = false;
      rows[i].row.classList.add(ok ? 'res-ok' : 'res-ng');
      rows[i].row.append(el('span', { class: 'mark ' + (ok ? 'ok' : 'ng') }, ok ? '正' : (should === 'o' ? '○が正しい' : '×が正しい')));
      Object.values(rows[i].bs).forEach(b => b.disabled = true);

      + (mine !== ans.size ? '<br><span style="color:var(--warn)">個数が合っていません。どこかの○×がまちがっているという合図です。</span>' : '');
    finish(q, allOk, area);
  }
}
