    const cur = EX.state[i];
    const row = el('div', { class: 'optrow' },
      el('div', { class: 'ot' }, `大問 ${i + 1}` + (cur ? `　${{ done: '✓ できた', hold: '△ 保留', blank: '✕ 無答' }[cur]}` : '')),
      el('div', { class: 'ob' },
        ...[['done', '✓'], ['hold', '△'], ['blank', '✕']].map(([k, lab]) =>
          el('button', { class: 'jb' + (cur === k ? (k === 'done' ? ' sel-o' : k === 'blank' ? ' sel-x' : ' sel-q') : ''), onclick: () => { EX.state[i] = k; EX.marks[i] = EX.marks[i] ?? (40 * 60 - EX.left); render(); } }, lab))));
    box.append(row);
  }
  a.append(box);
  if (EX.left <= 0 || !EX.running) {
    const blanks = EX.state.filter(x => x === 'blank' || x == null).length;
    a.append(el('div', { class: 'card' },
      el('h2', {}, '終わったら記録する'),
      blanks ? el('p', { html: `<span class="pill n">無答・未入力 ${blanks} 大問</span> ① 日能研の公開模試6回では、失点の36%が無答でした。記号は書くだけで当たることがあります。` }) : el('p', { class: 'muted' }, '無答はありません。'),
      el('div', { class: 'grid g2', style: 'margin:12px 0' },
        el('label', {}, el('div', { class: 'tiny' }, '理科の得点（100点満点）'), el('input', { id: 'exsc', class: 'numin', type: 'text', inputmode: 'numeric', placeholder: '例 76' })),
        el('label', {}, el('div', { class: 'tiny' }, '4科合計（400点満点・任意）'), el('input', { id: 'ex4', class: 'numin', type: 'text', inputmode: 'numeric', placeholder: '例 240' }))),
      el('button', { class: 'btn-primary', onclick: () => {
        const sc = parseInt($('#exsc').value); if (!Number.isFinite(sc)) return toast('理科の得点を入れてください');
        DB.exams.push({ d: today(), year: EX.year, score: sc, total4: parseInt($('#ex4').value) || null,
          blank: EX.state.filter(x => x === 'blank' || x == null).length, hold: EX.state.filter(x => x === 'hold').length, n: EX.n });
        save(); EX = null; VIEW = 'record'; $('#title').textContent = '記録'; render();
      } }, '記録して終わる'),
    ));
  }
}
// setInterval の呼ばれた回数で数えると、画面ロックや他アプリ切替で止まる。
// Date.now() から経過時間を計算する実時間方式に変える（finding 25）。
// さらに大問が切り替わった瞬間に下の文字と時計を一瞬点滅させる（finding 3）。
function tick() {
  clearInterval(window._tk);
  window._tk = setInterval(() => {
    if (!EX) return clearInterval(window._tk);
    if (!EX.running) return;
    const now = Date.now();
    const elapsed = Math.floor((now - EX.start - (EX.pausedMs || 0)) / 1000);
    EX.left = Math.max(0, 2400 - elapsed);
    const per = Math.floor(2400 / EX.n);
    const should = Math.min(EX.n, Math.floor((2400 - EX.left) / per) + 1);
    const d = $('#tdisp');
    if (d) {
      const m = Math.floor(EX.left / 60), s = EX.left % 60;
      d.textContent = `${m}:${String(s).padStart(2, '0')}`;
      d.className = 'timer' + (EX.left <= 300 ? ' low' : '');
    }
    const note = $('#should-note');
    if (note) note.textContent = `1大問あたり ${Math.floor(per / 60)}分${per % 60 ? per % 60 + '秒' : ''}　／　いまは大問${should}あたりの時間です`;
    if (should !== EX.lastShould) {
      EX.lastShould = should;
      // バイブ・点滅・下の文字の強調
      if (d) { d.classList.add('flash'); setTimeout(() => { const dd = $('#tdisp'); if (dd) dd.classList.remove('flash'); }, 1200); }
      if (note) { note.classList.add('changed'); setTimeout(() => { const nn = $('#should-note'); if (nn) nn.classList.remove('changed'); }, 2500); }
      if (navigator.vibrate) try { navigator.vibrate([120, 80, 120]); } catch (e) { }
    }
    if (EX.left === 0) { EX.running = false; render(); }
  }, 500);
}

/* ============================================================
   記録
   ============================================================ */
function viewRecord(a) {
  // 過去問の記録
  const ex = DB.exams.slice().reverse();
  const box = el('div', { class: 'card' }, el('h2', {}, '過去問の記録'));
  if (!ex.length) box.append(el('p', { class: 'muted' }, 'まだありません。40分タイマーを使うと、ここに残ります。'));
  else {
    const scores = DB.exams.map(e => e.score);
    const avg = (scores.reduce((s, x) => s + x, 0) / scores.length).toFixed(1);
    box.append(el('p', { html: `<b style="font-size:22px">平均 ${avg} 点</b>　<span class="pill">${scores.length}回</span>　<span class="pill ${avg >= DB.goal ? 'o' : 'w'}">目標 ${DB.goal}点</span>` }));
    box.append(el('table', {}, el('thead', {}, el('tr', {}, el('th', {}, '日'), el('th', {}, '年度'), el('th', {}, '理科'), el('th', {}, '無答'), el('th', {}, '4科'))),
      el('tbody', {}, ...ex.map(e => el('tr', {}, el('td', {}, e.d.slice(5)), el('td', {}, e.year || '—'), el('td', {}, String(e.score)), el('td', {}, String(e.blank)), el('td', {}, e.total4 ? String(e.total4) : '—'))))));
    box.append(el('p', { class: 'tiny' }, '① 筑駒2024年度は40分計測で76点（力学13/20・回路10/16・水溶液18/19・地学15/15）。この水準が再現するかを見るための記録です。'));
  }
  a.append(box);

  // 練習の履歴
  const days = [...new Set(DB.log.map(x => x.d))].sort().reverse().slice(0, 14);
  const h = el('div', { class: 'card' }, el('h2', {}, '練習の履歴（直近14日）'));
  if (!days.length) h.append(el('p', { class: 'muted' }, 'まだありません。'));
  else days.forEach(d => {
    const rs = DB.log.filter(x => x.d === d);
    const n = rs.reduce((s, x) => s + x.n, 0), ok = rs.reduce((s, x) => s + x.ok, 0);
    h.append(el('div', { class: 'kv' }, el('span', {}, d), el('b', {}, `${ok} / ${n} 問`)));
  });
  a.append(h);

  // 苦手の一覧
  const items = Object.entries(DB.items).filter(([, v]) => v.seen >= 2)
    .map(([k, v]) => ({ k, ...v, rate: v.ok / v.seen })).sort((a, b) => a.rate - b.rate).slice(0, 12);
  const w = el('div', { class: 'card' }, el('h2', {}, '正しく答えられていないもの'));
  if (!items.length) w.append(el('p', { class: 'muted' }, '2回以上やったものが集まると、ここに出ます。'));
  else items.forEach(i => w.append(el('div', { class: 'kv' }, el('span', {}, labelOf(i.k)), el('b', {}, `${i.ok} / ${i.seen}　次は ${i.due}`))));
  a.append(w);

  // 書き出し・読み込み
  const ta = el('textarea', { id: 'io', placeholder: 'ここに記録が出ます' });
  a.append(el('div', { class: 'card' }, el('h2', {}, '記録の書き出しと読み込み'),
    el('p', { class: 'tiny' }, 'iPad を変えるときや、消えてしまったときに使います。下の文字をすべてコピーして保管してください。'),
    el('div', { class: 'grid g2', style: 'margin:10px 0' },
      el('button', { class: 'btn-ghost', onclick: () => { ta.value = JSON.stringify(DB); toast('書き出しました'); } }, '書き出す'),
      el('button', { class: 'btn-ghost', onclick: () => {
        try { const r = JSON.parse(ta.value); if (!r.v) throw 0; if (!confirm('いまの記録を上書きします。よいですか。')) return; DB = Object.assign({}, DEFAULT, r); save(); toast('読み込みました'); render(); }
        catch (e) { toast('読み込めませんでした'); }
      } }, '読み込む')),
    ta,
    el('p', { class: 'tiny', style: 'margin-top:10px' }, '⛔ この端末の中だけに保存しています。ブラウザの履歴を消すと記録も消えます。ときどき書き出して保管してください。')
  ));

  // 自己点検
  a.append(el('div', { class: 'card' }, el('h2', {}, '計算が正しいかの点検'),
    el('p', { class: 'tiny' }, 'このアプリの答えは、すべてその場で計算して出しています。計算が正しいことを確かめられます。'),
    el('button', { class: 'btn-ghost', style: 'margin-top:8px', onclick: () => {
      const r = selfTest(); const ng = r.filter(x => !x.ok);
      alert(`${r.length - ng.length} / ${r.length} 合格` + (ng.length ? '\n\n失敗:\n' + ng.map(x => '・' + x.name).join('\n') : '\n\n（対照実験を2件ふくむ）'));
    } }, '点検する')));
}
function labelOf(k) {
  if (k.startsWith('lever:')) return { 'lever:tip': 'てこ（倒れる境目）', 'lever:tipYN': 'てこ（倒れるか）', 'lever:support': '両端で支える', 'lever:spring': 'ばね' }[k] || k;
  if (k.startsWith('sol:')) return { 'sol:crystal': '水溶液（冷やすと出てくる固体）', 'sol:leftover': '水溶液（とけ残り）', 'sol:water': '水溶液（必要な水）', 'sol:satw': '水溶液（水よう液の重さ）' }[k] || k;
  if (k.startsWith('circ:board')) return '回路（端子に導線をつなぐ）';
  if (k.startsWith('circ:')) { const p = k.split(':'); const c = CIRCUITS.find(x => x.id === p[1]); return `回路 ${c ? c.title : p[1]}（${{ off: '消灯', bright: '明るさ', batt: '電池の電流' }[p[p.length - 1]] || ''}）`; }
  const sa = SELECTALL.find(s => s.id === k); if (sa) return `すべて選べ: ${sa.q.slice(0, 22)}…`;
  const cd = CARDS.find(c => c.id === k); if (cd) return `${cd.theme}（${cd.id}）`;
  return k;
}

render();

// ウェブに置いたとき用: 一度開けば、電波がなくても動くようにする（本番会場対策）
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
